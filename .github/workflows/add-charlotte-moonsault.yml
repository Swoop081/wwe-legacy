name: Add Charlotte Moonsault Trademark
on:
  push:
    paths: ['.github/add-charlotte-moonsault-trigger-v2']
permissions:
  contents: write
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Add Charlotte's Moonsault to active gameplay array
        shell: python
        run: |
          from pathlib import Path
          import json,re
          cp=Path('js/data/content.js'); s=cp.read_text()
          if 'charlotte-flair-moonsault' in s: raise SystemExit('Already exists')
          # Balance locked from first successful benchmark: comparable aerial trademarks centered at Cost 6 / Damage 10.
          new={
            'id':'charlotte-flair-moonsault','name':"Charlotte's Moonsault",'type':'Move','setId':'evolution',
            'superstarId':'charlotte-flair','trademark':True,'method':'agility','cost':6,'damage':10,
            'rulesText':"Charlotte Flair-exclusive Trademark. Grounded opponent only. Diving Aerial. On Connect: gain +1 Adrenaline."
          }
          # Insert specifically into export const allGameplayCards = [ ... ], not the final array in content.js.
          marker='export const allGameplayCards = ['
          start=s.find(marker)
          if start<0: raise SystemExit('allGameplayCards array not found')
          i=start+len(marker); depth=1; quote=None; esc=False
          while i<len(s) and depth:
            c=s[i]
            if quote:
              if esc: esc=False
              elif c=='\\': esc=True
              elif c==quote: quote=None
            else:
              if c in ('"',"'",'`'): quote=c
              elif c=='[': depth+=1
              elif c==']': depth-=1
            i+=1
          if depth: raise SystemExit('Could not close allGameplayCards array')
          close=i-1
          payload=',\n  '+json.dumps(new,ensure_ascii=False,indent=2).replace('\n','\n  ')+'\n'
          cp.write_text(s[:close].rstrip()+payload+s[close:])
          mp=Path('js/data/card-number-manifest.js'); ms=mp.read_text()
          nums=[int(x) for x in re.findall(r'"cardCode":\s*"EVO1-(\d+)"',ms)]
          nxt=max(nums)+1; code=f'EVO1-{nxt:03d}'
          mend=ms.rfind('];')
          entry={'id':'charlotte-flair-moonsault','setId':'evolution','cardNumber':nxt,'cardCode':code}
          mp.write_text(ms[:mend].rstrip()+',\n  '+json.dumps(entry,ensure_ascii=False)+'\n'+ms[mend:])
          print('Added',code,"Charlotte's Moonsault — Agility, Cost 6, Damage 10")
      - name: Regenerate Card Studio and validate
        run: |
          node tools/generate-card-studio-data.mjs
          grep -q "Charlotte's Moonsault" js/tools/card-art-studio-data.js
          node tools/full-card-tier-audit.mjs
      - name: Commit
        run: |
          git config user.name "WWE Legacy Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add js/data/content.js js/data/card-number-manifest.js js/tools/card-art-studio-data.js
          git diff --cached --check
          git commit -m "Add Charlotte's Moonsault Evolution trademark"
          git push origin main
