name: Add Charlotte Moonsault Trademark
on:
  push:
    paths: ['.github/add-charlotte-moonsault-trigger-v6']
permissions:
  contents: write
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Add Charlotte's Moonsault to canonical Evolution set
        shell: python
        run: |
          from pathlib import Path
          import json,re
          cp=Path('js/data/content.js'); s=cp.read_text()
          if 'charlotte-flair-moonsault' in s: raise SystemExit('Already exists')
          new={'id':'charlotte-flair-moonsault','name':"Charlotte's Moonsault",'kind':'move','setId':'evolution-series-1','superstarId':'charlotte-flair','trademark':True,'method':'agility','moveType':'aerial','cost':6,'damage':10,'requirements':{'agility':1},'rarity':3,'rulesText':"Charlotte Flair-exclusive Trademark. Grounded opponent only. Diving Aerial. On Connect: gain +1 Adrenaline.",'groundOpponent':False,'groundedOnly':True,'stun':0,'selfDamage':0,'effects':[{'type':'gainAdrenaline','amount':1}],'counterState':'diving-aerial'}
          marker='export const allGameplayCards = ['; start=s.find(marker); i=start+len(marker); depth=1; q=None; esc=False
          while depth:
            c=s[i]
            if q:
              if esc: esc=False
              elif c=='\\': esc=True
              elif c==q: q=None
            else:
              if c in ('"',"'",'`'): q=c
              elif c=='[': depth+=1
              elif c==']': depth-=1
            i+=1
          close=i-1; cp.write_text(s[:close].rstrip()+',\n  '+json.dumps(new,indent=2).replace('\n','\n  ')+'\n'+s[close:])
          mp=Path('js/data/card-number-manifest.js'); ms=mp.read_text(); nums=[int(x) for x in re.findall(r'"cardCode":\s*"EVO1-(\d+)"',ms)]; nxt=max(nums)+1; code=f'EVO1-{nxt:03d}'; mend=ms.rfind('];')
          entry={'id':new['id'],'setId':'evolution-series-1','cardNumber':nxt,'cardCode':code}; mp.write_text(ms[:mend].rstrip()+',\n  '+json.dumps(entry)+'\n'+ms[mend:]); print('ADDED',code)
      - name: Regenerate and validate canonical collection
        run: |
          node tools/generate-card-studio-data.mjs
          grep -q 'charlotte-flair-moonsault' js/tools/card-art-studio-data.js
          grep -q 'charlotte-flair-moonsault' js/data/content.js
          grep -q 'charlotte-flair-moonsault' js/data/card-number-manifest.js
          grep -q 'evolution-series-1' js/data/card-number-manifest.js
      - name: Commit
        run: |
          git config user.name "WWE Legacy Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add js/data/content.js js/data/card-number-manifest.js js/tools/card-art-studio-data.js
          git diff --cached --check
          git commit -m "Add Charlotte's Moonsault Evolution trademark"
          git push origin main
