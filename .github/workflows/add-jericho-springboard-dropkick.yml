name: Add Jericho Springboard Dropkick
on:
  push:
    paths: ['.github/add-jericho-springboard-dropkick-trigger-v3']
permissions:
  contents: write
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Add Jericho move using verified aerial balance
        shell: python
        run: |
          from pathlib import Path
          import json,re
          cp=Path('js/data/content.js');s=cp.read_text()
          if 'chris-jericho-springboard-dropkick' in s: raise SystemExit('Already exists')
          new={'id':'chris-jericho-springboard-dropkick','name':"Jericho's Springboard Dropkick",'kind':'move','setId':'attitude-era-series-1','superstarId':'chris-jericho','trademark':True,'method':'agility','moveType':'agility','cost':6,'damage':10,'requirements':{'agility':1},'rarity':3,'rulesText':'Jericho-exclusive Trademark. Running Aerial. Grounds opponent. On Connect: gain +1 Adrenaline.','groundOpponent':False,'groundedOnly':False,'stun':0,'selfDamage':0,'effects':[],'counterState':'running-aerial'}
          marker='export const allGameplayCards = [';start=s.find(marker);i=start+len(marker);depth=1;q=None;esc=False
          while depth:
            c=s[i]
            if q:
              if esc:esc=False
              elif c=='\\':esc=True
              elif c==q:q=None
            else:
              if c in ('"',"'",'`'):q=c
              elif c=='[':depth+=1
              elif c==']':depth-=1
            i+=1
          close=i-1;cp.write_text(s[:close].rstrip()+',\n  '+json.dumps(new,indent=2).replace('\n','\n  ')+'\n'+s[close:])
          mp=Path('js/data/card-number-manifest.js');ms=mp.read_text();dec=json.JSONDecoder();entries=[];i=0
          while True:
            a=ms.find('{',i)
            if a<0:break
            try:o,n=dec.raw_decode(ms[a:])
            except:i=a+1;continue
            if isinstance(o,dict) and o.get('setId')=='attitude-era-series-1' and o.get('cardNumber') is not None:entries.append(o)
            i=a+n
          if not entries:raise SystemExit('No Attitude Era manifest entries')
          last=max(entries,key=lambda x:int(x['cardNumber']));n=int(last['cardNumber'])+1
          m=re.match(r'([^0-9]*[A-Z]+\d*-?)(\d+)$',str(last.get('cardCode','')))
          if not m:raise SystemExit('Cannot derive Attitude cardCode prefix from '+str(last))
          code=m.group(1)+str(n).zfill(len(m.group(2)));mend=ms.rfind('];')
          mp.write_text(ms[:mend].rstrip()+',\n  '+json.dumps({'id':new['id'],'setId':'attitude-era-series-1','cardNumber':n,'cardCode':code})+'\n'+ms[mend:])
          print('ADDED',code,'Cost 6 Damage 10')
      - name: Regenerate Card Studio and validate
        run: |
          node tools/generate-card-studio-data.mjs
          grep -q "Jericho's Springboard Dropkick" js/tools/card-art-studio-data.js
      - name: Commit
        run: |
          git config user.name "WWE Legacy Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add js/data/content.js js/data/card-number-manifest.js js/tools/card-art-studio-data.js
          git diff --cached --check
          git commit -m "Add Jericho's Springboard Dropkick Attitude trademark"
          git push origin main
