name: Apply Game Health Fixes Temp
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-game-health-fixes-temp.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Apply AI preservation hardening
        run: python tools/apply-ai-preservation-fix-temp.py
      - name: Validate systems and AI
        shell: bash
        run: |
          node --check js/ai/WrestlingAI.js
          node tools/full-card-tier-audit.mjs
          node tools/architecture-audit-temp.mjs
          node tools/ai-action-usage-audit.mjs
          node tools/ai-choice-audit.mjs
      - name: Commit AI hardening
        run: |
          git config user.name 'Swoop081'
          git config user.email 'justinbelot8@gmail.com'
          git add js/ai/WrestlingAI.js
          git commit -m 'v1.1.199 finalize AI card-preservation logic'
          git push origin main
