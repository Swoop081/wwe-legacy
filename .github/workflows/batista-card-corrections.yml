name: Batista Card Corrections
on:
  push:
    paths:
      - '.github/batista-card-corrections-trigger-v2'
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply canonical Batista corrections
        shell: python
        run: |
          from pathlib import Path
          import re, json
          manifest=Path('js/data/card-number-manifest.js').read_text()
          def id_for(code):
            m=re.search(r'\{\s*"id":\s*"([^"]+)"[^{}]*"cardCode":\s*"'+re.escape(code)+r'"\s*\}',manifest,re.S)
            if not m: raise SystemExit(f'{code} missing from manifest')
            return m.group(1)
          id14=id_for('RA1-014'); id15=id_for('RA1-015')
          print('RA1-014 id:',id14); print('RA1-015 id:',id15)
          content=Path('js/data/content.js')
          s=content.read_text(); old=s
          dec=json.JSONDecoder()
          # content.js canonical objects are JSON-shaped. Find exact object by ID and edit only that object.
          def replace_obj(text, card_id, edit):
            needle='"id": "'+card_id+'"'
            pos=text.find(needle)
            if pos<0: raise SystemExit(f'Canonical gameplay card {card_id} not found')
            start=text.rfind('{',0,pos)
            obj,end=dec.raw_decode(text[start:])
            before=json.dumps(obj,indent=2)
            obj=edit(obj)
            after=json.dumps(obj,indent=2)
            return text[:start]+after+text[start+end:]
          def edit14(o):
            if o.get('name')!='Spear': raise SystemExit(f"RA1-014 expected Spear, got {o.get('name')}")
            o['name']="Batista's Spear"
            return o
          def edit15(o):
            if o.get('name')!='Demon Bomb': raise SystemExit(f"RA1-015 expected Demon Bomb, got {o.get('name')}")
            # Preserve existing gameplay values/effects and identity; convert the card's presentation/classification only.
            o['name']="Batista's Powerslam"
            o['superstarId']='batista'
            o['trademark']=True
            rt=o.get('rulesText','')
            rt=re.sub(r'(?i)Demon Bomb',"Batista's Powerslam",rt)
            if 'Trademark' not in rt:
              rt='Batista-exclusive Trademark. '+rt
            o['rulesText']=rt
            return o
          s=replace_obj(s,id14,edit14)
          s=replace_obj(s,id15,edit15)
          if s==old: raise SystemExit('No canonical gameplay changes made')
          content.write_text(s)
      - name: Regenerate Card Art Studio data
        run: node tools/generate-card-studio-data.mjs
      - name: Verify exact cards
        shell: python
        run: |
          from pathlib import Path
          import re
          studio=Path('js/tools/card-art-studio-data.js').read_text()
          content=Path('js/data/content.js').read_text()
          manifest=Path('js/data/card-number-manifest.js').read_text()
          if "Batista's Spear" not in content or "Batista's Spear" not in studio: raise SystemExit('Batista Spear rename missing')
          if "Batista's Powerslam" not in content or "Batista's Powerslam" not in studio: raise SystemExit('Batista Powerslam rename missing')
          if re.search(r'"name"\s*:\s*"Demon Bomb"',content) or '"name":"Demon Bomb"' in studio: raise SystemExit('Demon Bomb still active')
          if '"trademark":true' not in studio[studio.find("Batista's Powerslam"):studio.find("Batista's Powerslam")+2000]: raise SystemExit('RA1-015 not Trademark in Studio')
          print('Verified live game + Card Studio Batista corrections')
      - name: Commit corrections
        run: |
          git config user.name "WWE Legacy Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add js/data/content.js js/tools/card-art-studio-data.js
          git diff --cached --check
          git commit -m "Rename Batista RA1-014 and RA1-015 cards"
          git push origin main
