name: Becky authentic 60-card deck apply
on:
  push:
    paths: ['.github/becky-authentic-60-apply-trigger']
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Audit Becky five-tier move curves
        run: node tools/becky-five-tier-audit.mjs
