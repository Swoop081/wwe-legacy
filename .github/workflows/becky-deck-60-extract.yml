name: Becky canonical 60-card deck extractor
on:
  push:
    paths: ['.github/becky-deck-60-extract-trigger']
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Produce compact Becky deck report
        run: |
          set -euo pipefail
          OUT=.github/becky-current-60-compact.txt
          : > "$OUT"
          {
            echo '=== FILES WITH BECKY ==='
            grep -RilE 'becky[- ]lynch|Becky Lynch|Manhandle Slam|Dis-arm-her|Straight Fire|Tap or Snap' js --include='*.js' | sort
            echo '=== BECKY LINES ==='
            grep -RniE 'becky[- ]lynch|Becky Lynch|Manhandle Slam|Dis-arm-her|Straight Fire|Tap or Snap' js/data js/shared --include='*.js' | head -n 500
          } >> "$OUT"
          echo '=== COMPACT REPORT ==='
          cat "$OUT"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$OUT"
          git commit -m 'Capture compact Becky deck source report' || exit 0
          git pull --rebase origin main
          git push origin main
