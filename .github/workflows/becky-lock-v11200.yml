name: Becky Lynch v1.1.200 final lock
'on':
  push:
    paths:
      - .github/becky-lock-v11200-trigger
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply and certify Becky lock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('js/data/content.js'); s=p.read_text()
          imp='import { BECKY_LYNCH_V11200_CARDS } from "./becky-lynch-v1.1.200.js?v=1.1.200";\n'
          if imp not in s:
            anchor='import { AJ_STYLES_GAMEPLAY_CARDS } from "./aj-styles-v1.1.80.js?v=1.1.132";\n'
            assert anchor in s
            s=s.replace(anchor,anchor+imp)
          marker='allGameplayCards.push(...AJ_STYLES_GAMEPLAY_CARDS);'
          assert marker in s
          if 'allGameplayCards.push(...BECKY_LYNCH_V11200_CARDS);' not in s:
            s=s.replace(marker,marker+'\nallGameplayCards.push(...BECKY_LYNCH_V11200_CARDS);')
          p.write_text(s)

          p=Path('js/data/decks.js'); s=p.read_text()
          m=re.search(r'  "becky-lynch": \[\n(.*?)\n  \],\n  "logan-paul":',s,re.S); assert m
          deck=[
            'momentum-strike','momentum-technical','momentum-strength','punch','arm-drag',
            'momentum-strike','momentum-strike','momentum-strike','momentum-strike',
            'momentum-technical','momentum-technical','momentum-technical','momentum-technical',
            'becky-lynch-manhandle-slam','becky-lynch-manhandle-slam','becky-lynch-dis-arm-her','becky-lynch-dis-arm-her',
            'becky-lynch-bex-plex','becky-lynch-bex-plex','becky-lynch-diving-leg-drop','becky-lynch-diving-leg-drop',
            'becky-lynch-flying-fire-arm','becky-lynch-flying-fire-arm',
            'punch','armbar','armbar','missile-dropkick','missile-dropkick','inverted-ddt','inverted-ddt',
            'leg-lariat','leg-lariat','calf-kick','calf-kick','hammerlock','hammerlock','european-uppercut','european-uppercut',
            'snap-suplex','snap-suplex','german-suplex','german-suplex','superplex',
            'special-becky-lynch','duck','sidestep','shoulder-up','once-too-often','standing-switch','up-and-over',
            'dodge','knees-up','catch-the-foot','grab-the-ropes','dropkick'
          ]
          assert len(deck)==58
          assert deck[:5]==['momentum-strike','momentum-technical','momentum-strength','punch','arm-drag']
          assert deck.count('momentum-strike')==5 and deck.count('momentum-technical')==5 and deck.count('momentum-strength')==1
          assert deck.count('once-too-often')==1
          assert deck.count('punch')==2
          for banned in ['chain-wrestling','game-plan','fire-up','jawbreaker','rollover-counter']:
            assert banned not in deck
          body='\n'.join('    "'+x+'"'+(',' if i<57 else '') for i,x in enumerate(deck))
          s=s[:m.start(1)]+body+s[m.end(1):]; p.write_text(s)

          p=Path('js/shared/v1.1.69-card-identity-pass.js'); s=p.read_text()
          old="""  'becky-lynch-dis-arm-her': {
    cost:7, damage:0, requirements:{technical:2}, method:'technical', trademark:true,
    printingStats:{
      base:{cost:8,damage:0}, emerald:{cost:8,damage:0}, sapphire:{cost:7,damage:0},
      ruby:{cost:7,damage:0}, amethyst:{cost:7,damage:0}
    }
  },"""
          new="""  'becky-lynch-dis-arm-her': {
    name:'Dis-arm-her', cost:9, damage:0, requirements:{}, method:null, moveType:'submission',
    submission:{bodyPart:'arm',pressure:6}, finisher:true, trademark:false,
    rulesText:'Becky Lynch-exclusive Finisher Submission. No Method requirement.',
    printingStats:{
      base:{cost:10,damage:0,submission:{bodyPart:'arm',pressure:3}},
      emerald:{cost:10,damage:0,submission:{bodyPart:'arm',pressure:4}},
      sapphire:{cost:9,damage:0,submission:{bodyPart:'arm',pressure:4}},
      ruby:{cost:9,damage:0,submission:{bodyPart:'arm',pressure:5}},
      amethyst:{cost:9,damage:0,submission:{bodyPart:'arm',pressure:6}}
    }
  },"""
          if old in s: s=s.replace(old,new)
          else:
            assert "name:'Dis-arm-her'" in s, 'unexpected Dis-arm-her override state'
          p.write_text(s)
          PY
          node --input-type=module <<'NODE'
          import { allGameplayCards } from './js/data/content.js';
          import { deckIds } from './js/data/decks.js';
          const byId=new Map(allGameplayCards.map(c=>[c.id,c]));
          const d=deckIds['becky-lynch'];
          const missing=[...new Set(d.filter(id=>!byId.has(id)))];
          console.log('Becky authored IDs:',d.length,'missing:',missing);
          if(d.length!==58 || missing.length) process.exit(2);
          const bex=byId.get('becky-lynch-bex-plex');
          if(bex.requirements?.strength!==1 || bex.requirements?.technical!==1) process.exit(3);
          const dis=byId.get('becky-lynch-dis-arm-her');
          if(!dis.finisher || dis.trademark || dis.method!==null || Object.keys(dis.requirements||{}).length) process.exit(4);
          const tiers=['base','emerald','sapphire','ruby','amethyst'];
          if(!tiers.every(t=>dis.printingStats?.[t]?.damage===0)) process.exit(5);
          if(dis.printingStats.base.submission.pressure>=dis.printingStats.amethyst.submission.pressure) process.exit(6);
          for(const id of ['dodge','knees-up','catch-the-foot','grab-the-ropes']) if(!byId.get(id)?.defensiveOnly) process.exit(7);
          console.log('PASS Becky final 60 identity/reversal/submission certification');
          NODE
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/data/content.js js/data/decks.js js/shared/v1.1.69-card-identity-pass.js js/data/becky-lynch-v1.1.200.js
          git commit -m 'Lock Becky Lynch authentic 60-card package'
          git pull --rebase origin main
          git push origin main
