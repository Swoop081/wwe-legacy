name: Boot runtime cache hotfix
on:
  push:
    paths:
      - '.github/workflows/boot-runtime-cache-hotfix.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Align boot shell with current build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('const currentBuild = "1.1.196";', 'const currentBuild = "1.1.199";')
          s=s.replace('/wwe-legacy/js/config/build.js?v=1.1.196', '/wwe-legacy/js/config/build.js?v=1.1.199')
          s=s.replace('./js/ui/app.js?v=1.1.196', './js/ui/app.js?v=1.1.199')
          s=s.replace('./js/shared/v1.1.151-placeholder-card-cleanup.js?v=1.1.196', './js/shared/v1.1.151-placeholder-card-cleanup.js?v=1.1.199')
          p.write_text(s)
          PY
          grep -q 'const currentBuild = "1.1.199"' index.html
          grep -q './js/ui/app.js?v=1.1.199' index.html
          grep -q '/wwe-legacy/js/config/build.js?v=1.1.199' index.html
      - name: Commit hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Align launch boot shell with v1.1.199 runtime'
          git push origin HEAD:main
