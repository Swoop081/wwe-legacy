name: Boot runtime diagnostic
on:
  push:
    paths:
      - '.github/workflows/boot-runtime-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: app.js syntax
        continue-on-error: true
        run: node --check js/ui/app.js
      - name: collection.js syntax
        continue-on-error: true
        run: node --check js/data/collection.js
      - name: superstars.js syntax
        continue-on-error: true
        run: node --check js/data/superstars.js
      - name: decks.js syntax
        continue-on-error: true
        run: node --check js/data/decks.js
      - name: artwork.js syntax
        continue-on-error: true
        run: node --check js/data/artwork.js
      - name: MatchEngine.js syntax
        continue-on-error: true
        run: node --check js/engine/MatchEngine.js
      - name: WrestlingAI.js syntax
        continue-on-error: true
        run: node --check js/ai/WrestlingAI.js
      - name: identity pass syntax
        continue-on-error: true
        run: node --check js/shared/v1.1.69-card-identity-pass.js
      - name: collection import runtime
        continue-on-error: true
        run: node --input-type=module -e "import('./js/data/collection.js').then(()=>console.log('COLLECTION_IMPORT_OK')).catch(e=>{console.error(e.stack||e);process.exit(1)})"
      - name: app import runtime
        continue-on-error: true
        run: node --input-type=module -e "import('./js/ui/app.js').then(()=>console.log('APP_IMPORT_OK')).catch(e=>{console.error(e.stack||e);process.exit(1)})"
