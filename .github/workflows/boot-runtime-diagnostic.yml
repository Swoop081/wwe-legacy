name: Boot runtime verification
on:
  push:
    paths:
      - '.github/workflows/boot-runtime-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify collection import
        run: node --input-type=module -e "import('./js/data/collection.js').then(()=>console.log('COLLECTION_IMPORT_OK')).catch(e=>{console.error(e.stack||e);process.exit(1)})"
      - name: Verify boot module syntax
        run: |
          node --check js/ui/app.js
          node --check js/data/collection.js
          node --check js/data/content.js
          node --check js/data/card-number-manifest.js
          node --check js/shared/v1.1.69-card-identity-pass.js
