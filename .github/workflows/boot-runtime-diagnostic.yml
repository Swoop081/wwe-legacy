name: Boot runtime diagnostic
on:
  push:
    paths:
      - '.github/workflows/boot-runtime-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Find duplicate gameplay card IDs
        run: |
          node --input-type=module <<'NODE'
          import { allGameplayCards } from './js/data/content.js';
          const byId = new Map();
          for (const card of allGameplayCards) {
            if (!byId.has(card.id)) byId.set(card.id, []);
            byId.get(card.id).push(card);
          }
          const dupes = [...byId].filter(([,cards]) => cards.length > 1);
          console.log('GAMEPLAY_CARD_COUNT', allGameplayCards.length);
          console.log('DUPLICATE_ID_COUNT', dupes.length);
          for (const [id,cards] of dupes) console.log('DUPLICATE', id, JSON.stringify(cards.map(c=>({name:c.name,setId:c.setId,superstarId:c.superstarId,kind:c.kind}))));
          if (dupes.length) process.exit(1);
          NODE
      - name: collection import runtime
        if: always()
        run: node --input-type=module -e "import('./js/data/collection.js').then(()=>console.log('COLLECTION_IMPORT_OK')).catch(e=>{console.error(e.stack||e);process.exit(1)})"
