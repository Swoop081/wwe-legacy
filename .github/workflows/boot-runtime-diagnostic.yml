name: Boot runtime diagnostic
on:
  push:
    paths:
      - '.github/workflows/boot-runtime-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Report collection identity drift
        run: |
          node --input-type=module <<'NODE'
          import { allGameplayCards } from './js/data/content.js';
          import { superstars } from './js/data/superstars.js';
          import { CARD_NUMBER_MANIFEST } from './js/data/card-number-manifest.js';
          const active = [...allGameplayCards, ...Object.values(superstars).map(s=>({id:`superstar-${s.id}`,setId:s.setId,name:s.name,kind:'superstar'}))];
          const activeById = new Map(active.map(c=>[c.id,c]));
          const manifestById = new Map(CARD_NUMBER_MANIFEST.map(c=>[c.id,c]));
          const missing = active.filter(c=>!manifestById.has(c.id));
          const inactive = CARD_NUMBER_MANIFEST.filter(c=>!activeById.has(c.id));
          const mismatch = active.filter(c=>manifestById.has(c.id)&&manifestById.get(c.id).setId!==c.setId);
          console.log('ACTIVE', active.length, 'MANIFEST', CARD_NUMBER_MANIFEST.length);
          console.log('MISSING_FROM_MANIFEST', JSON.stringify(missing.map(c=>({id:c.id,name:c.name,setId:c.setId,kind:c.kind}))));
          console.log('INACTIVE_IN_MANIFEST', JSON.stringify(inactive));
          console.log('SET_MISMATCH', JSON.stringify(mismatch.map(c=>({id:c.id,active:c.setId,manifest:manifestById.get(c.id).setId}))));
          if (missing.length || inactive.length || mismatch.length) process.exit(1);
          NODE
