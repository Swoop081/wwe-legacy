name: Card Studio Export Canvas Verification Fix
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/card-studio-repair-trigger-v6'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix false taint verification against preview canvas
        shell: python
        run: |
          from pathlib import Path
          p=Path('js/tools/card-art-studio-core.js')
          s=p.read_text(encoding='utf-8')
          old="if(!canvasIsOriginClean())throw new Error('Clean export canvas was tainted outside drawImage.');"
          new="try{cleanCtx.getImageData(0,0,1,1);}catch(e){throw new Error('Clean export canvas is still cross-origin after isolated rendering.');}"
          if old not in s: raise SystemExit('v1.1.208 false verification line not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Bump Studio to v1.1.209
        shell: python
        run: |
          from pathlib import Path
          import re
          h=Path('tools/card-art-studio.html');s=h.read_text(encoding='utf-8')
          s=re.sub(r'CARD ART STUDIO · v1\.1\.\d+','CARD ART STUDIO · v1.1.209',s)
          s=re.sub(r'card-art-studio\.js\?v=[^"\']+','card-art-studio.js?v=1.1.209-export-canvas-verification',s)
          s=re.sub(r'card-art-studio-url-export-guard\.js\?v=[^"\']+','card-art-studio-url-export-guard.js?v=1.1.209',s)
          h.write_text(s,encoding='utf-8')
          w=Path('js/tools/card-art-studio.js');x=w.read_text(encoding='utf-8')
          x=re.sub(r'card-art-studio-core\.js\?v=[^"\']+','card-art-studio-core.js?v=1.1.209-export-canvas-verification',x)
          w.write_text(x,encoding='utf-8')
      - name: Verify and commit
        run: |
          node --check js/tools/card-art-studio-core.js
          grep -q 'v1.1.209' tools/card-art-studio.html
          grep -q '1.1.209-export-canvas-verification' js/tools/card-art-studio.js
          git config user.name "WWE Legacy Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add js/tools/card-art-studio-core.js js/tools/card-art-studio.js tools/card-art-studio.html
          git diff --cached --check
          git commit -m "v1.1.209 verify actual clean Card Studio export canvas"
          git push origin main
