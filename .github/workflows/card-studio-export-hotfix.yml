name: Card Studio Returned Canvas Export Fix
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/card-studio-repair-trigger-v7'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch export callers to encode returned clean canvas
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('js/tools/card-art-studio-core.js')
          s=p.read_text(encoding='utf-8')
          # prepareExport now returns the clean reconstructed canvas. Any caller that awaits it
          # and then encodes global `canvas` is wrong because prepareExport restores the preview.
          # Rewrite those immediate caller patterns to retain and encode the returned surface.
          patterns=[
            (r'await prepareExport\(\);\s*const blob=await canvasToBlob\(canvas,', 'const exportCanvas=await prepareExport();const blob=await canvasToBlob(exportCanvas,'),
            (r'await prepareExport\(\);\s*const blob=await canvasToBlob\(', 'const exportCanvas=await prepareExport();const blob=await canvasToBlob(exportCanvas,'),
            (r'await prepareExport\(\);\s*canvas\.toBlob\(', 'const exportCanvas=await prepareExport();exportCanvas.toBlob('),
          ]
          changed=0
          for pat,repl in patterns:
            s,n=re.subn(pat,repl,s)
            changed+=n
          # Also handle compressed assignment forms such as prepareExport();...canvasToBlob(canvas,...)
          if changed==0:
            idx=[m.start() for m in re.finditer(r'prepareExport\(\)',s)]
            print('prepareExport call count',len(idx))
            for pos in idx:
              print(s[max(0,pos-600):pos+1400])
            raise SystemExit('No export caller pattern patched; printed live caller context')
          print('patched export callers',changed)
          p.write_text(s,encoding='utf-8')
      - name: Bump Studio to v1.1.210
        shell: python
        run: |
          from pathlib import Path
          import re
          h=Path('tools/card-art-studio.html');s=h.read_text(encoding='utf-8')
          s=re.sub(r'CARD ART STUDIO · v1\.1\.\d+','CARD ART STUDIO · v1.1.210',s)
          s=re.sub(r'card-art-studio\.js\?v=[^"\']+','card-art-studio.js?v=1.1.210-returned-clean-canvas',s)
          s=re.sub(r'card-art-studio-url-export-guard\.js\?v=[^"\']+','card-art-studio-url-export-guard.js?v=1.1.210',s)
          h.write_text(s,encoding='utf-8')
          w=Path('js/tools/card-art-studio.js');x=w.read_text(encoding='utf-8')
          x=re.sub(r'card-art-studio-core\.js\?v=[^"\']+','card-art-studio-core.js?v=1.1.210-returned-clean-canvas',x)
          w.write_text(x,encoding='utf-8')
      - name: Verify and commit
        run: |
          node --check js/tools/card-art-studio-core.js
          grep -q 'v1.1.210' tools/card-art-studio.html
          grep -q '1.1.210-returned-clean-canvas' js/tools/card-art-studio.js
          git config user.name "WWE Legacy Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add js/tools/card-art-studio-core.js js/tools/card-art-studio.js tools/card-art-studio.html
          git diff --cached --check
          git commit -m "v1.1.210 encode clean Card Studio export canvas directly"
          git push origin main
