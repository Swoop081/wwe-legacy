name: Card Studio URL Export Hotfix
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/card-studio-repair-trigger-v3'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch exact prepareExport path
        shell: python
        run: |
          from pathlib import Path
          p=Path('js/tools/card-art-studio-core.js')
          s=p.read_text(encoding='utf-8')
          old='if(!canvasIsOriginClean())throw new Error("This artwork source cannot be exported safely. Re-select only the artwork image with the file picker; all WWE Legacy templates and set logos are now export-safe automatically.");'
          new='if(!canvasIsOriginClean()){const src=String(state.art?.currentSrc||state.art?.src||"");if(src.startsWith("blob:")||src.startsWith("data:")){resetCanvasSurface();renderForExport();}if(!canvasIsOriginClean())throw new Error("This artwork source cannot be exported safely. Re-select only the artwork image with the file picker; all WWE Legacy templates and set logos are now export-safe automatically.");}'
          if old not in s:
              raise SystemExit('exact prepareExport guard not found')
          s=s.replace(old,new,1)
          s=s.replace("Darby’s normal-card workflow","normal-card workflow").replace("Darby's normal-card workflow","normal-card workflow").replace('Darby · ','').replace('Darby ·','')
          p.write_text(s,encoding='utf-8')
      - name: Bump cache keys
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('tools/card-art-studio.html'); s=p.read_text(encoding='utf-8')
          s=re.sub(r'CARD ART STUDIO · v1\.1\.\d+', 'CARD ART STUDIO · v1.1.205', s)
          s=re.sub(r'card-art-studio\.js\?v=[^"\']+', 'card-art-studio.js?v=1.1.205-card-studio-export-hotfix', s)
          s=re.sub(r'card-art-studio-url-export-guard\.js\?v=[^"\']+', 'card-art-studio-url-export-guard.js?v=1.1.205', s)
          p.write_text(s,encoding='utf-8')
          w=Path('js/tools/card-art-studio.js'); x=w.read_text(encoding='utf-8')
          x=re.sub(r'card-art-studio-core\.js\?v=[^"\']+', 'card-art-studio-core.js?v=1.1.205-url-export-core-fix', x)
          w.write_text(x,encoding='utf-8')
      - name: Verify and commit
        run: |
          grep -q 'v1.1.205' tools/card-art-studio.html
          grep -q '1.1.205-url-export-core-fix' js/tools/card-art-studio.js
          ! grep -qi 'Darby' js/tools/card-art-studio-core.js
          git config user.name "WWE Legacy Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add js/tools/card-art-studio-core.js js/tools/card-art-studio.js tools/card-art-studio.html
          git diff --cached --check
          git commit -m "v1.1.205 fix Card Studio URL finished-front export"
          git push origin main
