name: Card Studio URL Export Hotfix
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/card-studio-repair-trigger'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch actual Card Studio core
        shell: python
        run: |
          from pathlib import Path
          p=Path('js/tools/card-art-studio-core.js')
          s=p.read_text(encoding='utf-8')
          error='Export failed: This artwork source cannot be exported safely. Re-select only the artwork image with the file picker; all WWE Legacy templates and set logos are now export-safe automatically.'
          i=s.find(error)
          if i < 0:
              raise SystemExit('target export error not found')
          # The core already tracks whether artwork is safe. Find the exact safety assignment nearest
          # the export rejection and make blob/data sources unconditionally safe; those schemes are
          # browser-owned bytes and cannot taint a canvas.
          context_start=max(0,i-12000)
          context=s[context_start:i]
          candidates=[]
          for token in ('artExportSafe','artSourceExportSafe','artworkExportSafe','isArtworkExportSafe','exportSafe'):
              pos=context.rfind(token)
              if pos >= 0: candidates.append((context_start+pos,token))
          if not candidates:
              print(s[max(0,i-5000):i+1000])
              raise SystemExit('safety state not found')
          j,token=max(candidates)
          print('safety token:',token,'at',j,'error at',i)
          # Find the enclosing rejection if-condition containing the safety token.
          cond_start=s.rfind('if', max(0,j-1200), i)
          brace=s.find('{', cond_start, i)
          if cond_start < 0 or brace < 0:
              print(s[max(0,j-2000):i+1000])
              raise SystemExit('rejection condition not found')
          cond=s[cond_start:brace]
          # Only bypass this rejection when the current artwork has already been converted to
          # blob:/data:. Remote http(s) images continue to use the existing safety protection.
          safe_expr="String((artImage && (artImage.currentSrc || artImage.src)) || '')"
          new_cond=f"if (({cond[2:].strip()}) && !{safe_expr}.startsWith('blob:') && !{safe_expr}.startsWith('data:')) "
          s=s[:cond_start]+new_cond+s[brace:]
          s=s.replace("Darby’s normal-card workflow","normal-card workflow").replace("Darby's normal-card workflow","normal-card workflow").replace('Darby · ','').replace('Darby ·','')
          p.write_text(s,encoding='utf-8')
      - name: Bump all Card Studio runtime cache keys
        shell: python
        run: |
          from pathlib import Path
          p=Path('tools/card-art-studio.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('CARD ART STUDIO · v1.1.202','CARD ART STUDIO · v1.1.203')
          s=s.replace('card-art-studio.js?v=1.1.202-card-studio-export-hotfix','card-art-studio.js?v=1.1.203-card-studio-export-hotfix')
          s=s.replace('card-art-studio-url-export-guard.js?v=1.1.202','card-art-studio-url-export-guard.js?v=1.1.203')
          p.write_text(s,encoding='utf-8')
          w=Path('js/tools/card-art-studio.js'); x=w.read_text(encoding='utf-8')
          x=x.replace('card-art-studio-core.js?v=1.1.197-card-studio-sync','card-art-studio-core.js?v=1.1.203-url-export-core-fix')
          w.write_text(x,encoding='utf-8')
      - name: Verify and commit production files
        run: |
          grep -q 'v1.1.203' tools/card-art-studio.html
          grep -q '1.1.203-url-export-core-fix' js/tools/card-art-studio.js
          ! grep -qi 'Darby' js/tools/card-art-studio-core.js
          git config user.name "WWE Legacy Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add js/tools/card-art-studio-core.js js/tools/card-art-studio.js tools/card-art-studio.html
          git diff --cached --check
          git commit -m "v1.1.203 restore Card Studio URL finished-front export"
          git push origin main
