name: Card Studio Direct Clean Canvas Encoding Fix
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/card-studio-repair-trigger-v8'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch exact live export callers
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess
          p=Path('js/tools/card-art-studio-core.js')
          s=p.read_text(encoding='utf-8')
          # Recover the original prepareExport return semantics from the last pre-clean-canvas core.
          old=subprocess.check_output(['git','show','1108335f66b2bde06195dcf9a6132677b6b4b7a0:js/tools/card-art-studio-core.js'],text=True)
          def fnblock(src,name):
            start=src.find('async function '+name+'(')
            if start<0: raise SystemExit(name+' not found')
            brace=src.find('{',start); depth=0
            for k in range(brace,len(src)):
              if src[k]=='{': depth+=1
              elif src[k]=='}':
                depth-=1
                if depth==0:return src[start:k+1]
            raise SystemExit(name+' block unterminated')
          original=fnblock(old,'prepareExport')
          print('ORIGINAL PREPARE EXPORT:',original)
          # Original function returns the selected card object expected by destinationFor/exportFilename.
          returns=re.findall(r'return\s+([^;]+);',original)
          if not returns: raise SystemExit('original prepareExport return not found')
          return_expr=returns[-1]
          # Find declarations needed by that return expression (normally card).
          decl=''
          m=re.search(r'(?:const|let|var)\s+'+re.escape(return_expr)+r'\s*=\s*[^;]+;',original)
          if m: decl=m.group(0)
          print('RETURN EXPR:',return_expr,'DECL:',decl)
          current=fnblock(s,'prepareExport')
          # Keep a dedicated clean surface available to encoder while restoring preview globals.
          replacement=current
          if decl and decl not in replacement:
            replacement=replacement.replace('{','{'+decl,1)
          replacement=replacement.replace('return clean;',"globalThis.__WWE_CARD_STUDIO_EXPORT_CANVAS=clean;return "+return_expr+';',1)
          if replacement==current: raise SystemExit('clean return not patched')
          s=s.replace(current,replacement,1)
          # encodedCardFile currently encodes the global preview canvas. Temporarily point global
          # canvas/context at the clean surface only for encoding, then restore immediately.
          marker='async function encodedCardFile('
          ei=s.find(marker)
          if ei<0: raise SystemExit('encodedCardFile not found')
          eb=s.find('{',ei); depth=0; end=None
          for k in range(eb,len(s)):
            if s[k]=='{': depth+=1
            elif s[k]=='}':
              depth-=1
              if depth==0: end=k+1; break
          enc=s[ei:end]
          body_start=enc.find('{')+1
          body_end=enc.rfind('}')
          body=enc[body_start:body_end]
          wrapped="{const __previewCanvas=canvas,__previewCtx=ctx;const __exportCanvas=globalThis.__WWE_CARD_STUDIO_EXPORT_CANVAS;if(__exportCanvas){canvas=__exportCanvas;ctx=__exportCanvas.getContext('2d',{alpha:true});}try{"+body+"}finally{canvas=__previewCanvas;ctx=__previewCtx;globalThis.__WWE_CARD_STUDIO_EXPORT_CANVAS=null;}}"
          s=s[:ei]+enc[:body_start-1]+wrapped+s[end:]
          p.write_text(s,encoding='utf-8')
      - name: Bump Studio to v1.1.210
        shell: python
        run: |
          from pathlib import Path
          import re
          h=Path('tools/card-art-studio.html');s=h.read_text(encoding='utf-8')
          s=re.sub(r'CARD ART STUDIO · v1\.1\.\d+','CARD ART STUDIO · v1.1.210',s)
          s=re.sub(r'card-art-studio\.js\?v=[^"\']+','card-art-studio.js?v=1.1.210-direct-clean-encode',s)
          s=re.sub(r'card-art-studio-url-export-guard\.js\?v=[^"\']+','card-art-studio-url-export-guard.js?v=1.1.210',s)
          h.write_text(s,encoding='utf-8')
          w=Path('js/tools/card-art-studio.js');x=w.read_text(encoding='utf-8')
          x=re.sub(r'card-art-studio-core\.js\?v=[^"\']+','card-art-studio-core.js?v=1.1.210-direct-clean-encode',x)
          w.write_text(x,encoding='utf-8')
      - name: Verify and commit
        run: |
          node --check js/tools/card-art-studio-core.js
          grep -q '__WWE_CARD_STUDIO_EXPORT_CANVAS' js/tools/card-art-studio-core.js
          grep -q 'v1.1.210' tools/card-art-studio.html
          git config user.name "WWE Legacy Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add js/tools/card-art-studio-core.js js/tools/card-art-studio.js tools/card-art-studio.html
          git diff --cached --check
          git commit -m "v1.1.210 encode reconstructed Card Studio canvas directly"
          git push origin main
