name: Card Studio Clean Canvas Export Repair
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/card-studio-repair-trigger-v4'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace tainted preview export with clean-canvas reconstruction
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('js/tools/card-art-studio-core.js')
          s=p.read_text(encoding='utf-8')
          # The preview canvas can already be tainted. Export must render onto a brand-new
          # canvas after localising every image element that can be drawn by renderForExport.
          marker='async function prepareExport()'
          i=s.find(marker)
          if i < 0: raise SystemExit('prepareExport not found')
          j=s.find('async function', i+len(marker))
          if j < 0: raise SystemExit('next async function not found')
          old=s[i:j]
          print('Replacing prepareExport block:', old[:2500])
          new=r'''async function prepareExport(){
            const originalCanvas=canvas;
            const originalCtx=ctx;
            const originalImages=[];
            const revoke=[];
            try{
              // Localise all loaded image elements used anywhere by the Studio renderer.
              const imgs=[...document.images];
              for(const img of imgs){
                const src=String(img.currentSrc||img.src||'');
                if(!src||src.startsWith('blob:')||src.startsWith('data:'))continue;
                let u;
                try{u=new URL(src,location.href)}catch(_){continue}
                if(u.origin===location.origin)continue;
                const r=await fetch(src,{mode:'cors',credentials:'omit',cache:'no-store'});
                if(!r.ok)throw new Error('Export layer could not be localised: '+r.status);
                const b=await r.blob();
                const local=URL.createObjectURL(b); revoke.push(local);
                originalImages.push([img,img.src]);
                await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=local;});
              }
              // Render from state onto a completely new surface. Never export the live preview canvas.
              const clean=document.createElement('canvas');
              clean.width=canvas.width; clean.height=canvas.height;
              canvas=clean; ctx=clean.getContext('2d',{alpha:true});
              resetCanvasSurface();
              renderForExport();
              await new Promise(requestAnimationFrame);
              if(!canvasIsOriginClean())throw new Error('A rendered card layer is still cross-origin after clean export reconstruction.');
              return clean;
            }catch(error){
              throw error;
            }finally{
              canvas=originalCanvas; ctx=originalCtx;
              for(const [img,src] of originalImages){img.src=src;}
              for(const u of revoke)URL.revokeObjectURL(u);
            }
          }
          '''
          s=s[:i]+new+s[j:]
          p.write_text(s,encoding='utf-8')
      - name: Bump Studio to v1.1.207
        shell: python
        run: |
          from pathlib import Path
          import re
          h=Path('tools/card-art-studio.html'); s=h.read_text(encoding='utf-8')
          s=re.sub(r'CARD ART STUDIO · v1\.1\.\d+','CARD ART STUDIO · v1.1.207',s)
          s=re.sub(r'card-art-studio\.js\?v=[^"\']+','card-art-studio.js?v=1.1.207-clean-canvas-export',s)
          s=re.sub(r'card-art-studio-url-export-guard\.js\?v=[^"\']+','card-art-studio-url-export-guard.js?v=1.1.207',s)
          h.write_text(s,encoding='utf-8')
          w=Path('js/tools/card-art-studio.js'); x=w.read_text(encoding='utf-8')
          x=re.sub(r'card-art-studio-core\.js\?v=[^"\']+','card-art-studio-core.js?v=1.1.207-clean-canvas-export',x)
          w.write_text(x,encoding='utf-8')
      - name: Verify syntax and commit
        run: |
          node --check js/tools/card-art-studio-core.js
          grep -q 'v1.1.207' tools/card-art-studio.html
          grep -q '1.1.207-clean-canvas-export' js/tools/card-art-studio.js
          git config user.name "WWE Legacy Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add js/tools/card-art-studio-core.js js/tools/card-art-studio.js tools/card-art-studio.html
          git diff --cached --check
          git commit -m "v1.1.207 rebuild Card Studio export on clean canvas"
          git push origin main
