name: Card Studio URL Export Hotfix
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/card-studio-repair-trigger-v2'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Diagnose and patch actual Card Studio core
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('js/tools/card-art-studio-core.js')
          s=p.read_text(encoding='utf-8')
          # Locate the real current error text by its stable unique phrase, not an obsolete full sentence.
          needle='artwork source cannot be exported safely'
          low=s.lower()
          i=low.find(needle)
          if i < 0:
              raise SystemExit('current export-safety message not found')
          print('Found current export-safety message at', i)
          print(s[max(0,i-2500):i+1200])
          # Find the nearest preceding if-block that leads to the safety error.
          cond_start=s.rfind('if', max(0,i-3500), i)
          brace=s.find('{', cond_start, i)
          if cond_start < 0 or brace < 0:
              raise SystemExit('current export-safety condition not found')
          cond=s[cond_start:brace]
          print('Current rejection condition:',cond)
          # Exempt only browser-owned local byte sources. A blob:/data: image cannot taint canvas.
          # Use the actual artwork image element identifier found in the nearby condition/context.
          nearby=s[max(0,cond_start-2500):i]
          names=re.findall(r'\b([A-Za-z_$][\w$]*(?:Image|Img|image|img))\b',nearby)
          art_name=None
          for name in reversed(names):
              if name not in ('Image','HTMLImageElement'):
                  art_name=name; break
          if not art_name:
              raise SystemExit('artwork image variable not found near safety guard')
          print('Artwork image variable:',art_name)
          safe_expr=f"String(({art_name} && ({art_name}.currentSrc || {art_name}.src)) || '')"
          raw=cond[2:].strip()
          new_cond=f"if (({raw}) && !{safe_expr}.startsWith('blob:') && !{safe_expr}.startsWith('data:')) "
          s=s[:cond_start]+new_cond+s[brace:]
          s=s.replace("Darby’s normal-card workflow","normal-card workflow").replace("Darby's normal-card workflow","normal-card workflow").replace('Darby · ','').replace('Darby ·','')
          p.write_text(s,encoding='utf-8')
      - name: Bump Card Studio cache keys
        shell: python
        run: |
          from pathlib import Path
          p=Path('tools/card-art-studio.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('CARD ART STUDIO · v1.1.202','CARD ART STUDIO · v1.1.204').replace('CARD ART STUDIO · v1.1.203','CARD ART STUDIO · v1.1.204')
          s=s.replace('card-art-studio.js?v=1.1.202-card-studio-export-hotfix','card-art-studio.js?v=1.1.204-card-studio-export-hotfix').replace('card-art-studio.js?v=1.1.203-card-studio-export-hotfix','card-art-studio.js?v=1.1.204-card-studio-export-hotfix')
          s=s.replace('card-art-studio-url-export-guard.js?v=1.1.202','card-art-studio-url-export-guard.js?v=1.1.204').replace('card-art-studio-url-export-guard.js?v=1.1.203','card-art-studio-url-export-guard.js?v=1.1.204')
          p.write_text(s,encoding='utf-8')
          w=Path('js/tools/card-art-studio.js'); x=w.read_text(encoding='utf-8')
          x=re.sub(r'card-art-studio-core\.js\?v=[^"\']+', 'card-art-studio-core.js?v=1.1.204-url-export-core-fix', x)
          w.write_text(x,encoding='utf-8')
      - name: Verify and commit production files
        run: |
          grep -q 'v1.1.204' tools/card-art-studio.html
          grep -q '1.1.204-url-export-core-fix' js/tools/card-art-studio.js
          ! grep -qi 'Darby' js/tools/card-art-studio-core.js
          git config user.name "WWE Legacy Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add js/tools/card-art-studio-core.js js/tools/card-art-studio.js tools/card-art-studio.html
          git diff --cached --check
          git commit -m "v1.1.204 restore Card Studio URL finished-front export"
          git push origin main
