name: Deploy WWE Legacy v1.1.45

on:
  push:
    paths:
      - '.deploy-v1145/READY'

permissions:
  contents: write

concurrency:
  group: wwe-legacy-v1145-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v1.1.45 runtime overlay
        shell: bash
        run: |
          set -euo pipefail
          cat .deploy-v1145/patch.b64.* | base64 -d > /tmp/v1145.patch
          git apply --check /tmp/v1145.patch
          git apply /tmp/v1145.patch
          npm run stamp-cache

      - name: Verify release
        shell: bash
        run: |
          set -euo pipefail
          node --check js/ui/app.js
          node --test \
            test/v1144-arm-drag-merge-card-studio-global-parity.test.js \
            test/v1122-universal-animated-card-shell.test.js \
            test/v1135-presentation-source-of-truth.test.js
          npm run flow
          npm run validate
          npm run card-ids

      - name: Publish v1.1.45 to main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .deploy-v1145
          rm -f .github/workflows/deploy-v1145.yml
          git config user.name "WWE Legacy Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "WWE Legacy v1.1.45 — Card Studio Atomic Ink Layer"
          git push origin HEAD:main
