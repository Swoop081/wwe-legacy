name: Deploy WWE Legacy v1.1.46

on:
  push:
    paths:
      - '.release-v1146/READY'

permissions:
  contents: write

concurrency:
  group: wwe-legacy-v1146
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact Card Studio Canvas face
        run: python .release-v1146/apply.py
      - name: Verify release
        run: |
          node --check js/ui/app.js
          node --test test/v1146-card-studio-canvas-source-of-truth.test.js test/v1145-card-studio-atomic-ink-layer.test.js test/v1138-card-studio-runtime-animation-layering.test.js
          npm run flow
          npm run validate
          npm run card-ids
      - name: Publish v1.1.46 to main
        run: |
          rm -rf .release-v1146 .github/workflows/deploy-v1146.yml
          git config user.name "WWE Legacy Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "WWE Legacy v1.1.46 — Exact Card Studio Canvas Face"
          git push origin HEAD:main
