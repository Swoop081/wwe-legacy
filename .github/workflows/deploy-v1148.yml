name: Deploy WWE Legacy v1.1.48

on:
  push:
    paths:
      - '.deploy-v1148/READY'

permissions:
  contents: write

concurrency:
  group: wwe-legacy-v1148
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize and apply shared dynamic card-face release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p js/shared test
          cat .deploy-v1148/renderer-parts/part-* > /tmp/renderer.gz.b64
          test "$(wc -c < /tmp/renderer.gz.b64 | tr -d ' ')" = "31160"
          base64 -d /tmp/renderer.gz.b64 | gunzip > js/shared/card-face-renderer.js
          test "$(wc -c < js/shared/card-face-renderer.js | tr -d ' ')" = "64137"
          base64 -d .deploy-v1148/test.gz.b64 | gunzip > test/v1148-shared-card-face-renderer.test.js
          base64 -d .deploy-v1148/patch.gz.b64 | gunzip > /tmp/v1.1.48-existing.patch
          git apply --check --ignore-space-change --ignore-whitespace \
            --exclude=BUILD-CERTIFICATION.md \
            --exclude=README.md \
            --exclude=RELEASE-NOTES-v1.1.29.md \
            --exclude=js/ui/app.js \
            /tmp/v1.1.48-existing.patch
          git apply --ignore-space-change --ignore-whitespace \
            --exclude=BUILD-CERTIFICATION.md \
            --exclude=README.md \
            --exclude=RELEASE-NOTES-v1.1.29.md \
            --exclude=js/ui/app.js \
            /tmp/v1.1.48-existing.patch
          python - <<'PY'
          from pathlib import Path
          path=Path('js/ui/app.js')
          text=path.read_text()
          start=text.index('// v1.1.46 — the live collectible face is painted by Canvas using the same')
          end=text.index('function renderCardStudioInkLayers(scope=document){', start)
          replacement='''// v1.1.48 — Card Studio and the live game share one dynamic face renderer.
          // The runtime only owns payload/DOM plumbing; all visible plaque typography,
          // rarity stars and Method dots are drawn by js/shared/card-face-renderer.js.
          function cardStudioInkPayload(card){
            if(!card)return "";
            return encodeURIComponent(JSON.stringify({id:card.id,name:card.name,kind:card.kind,setId:card.setId,superstarId:card.superstarId??null,rarity:card.rarity??1,cost:card.cost??0,damage:card.damage??0,requirements:card.requirements??{},finisher:Boolean(card.finisher),moveType:card.moveType??card.method??"move",duration:card.duration??1}));
          }
          function layeredCardStudioInkMarkup(card){
            if(!card||card.kind==="momentum")return "";
            return `<canvas class="ccg-card-studio-ink" width="680" height="1000" data-card-studio-ink="${cardStudioInkPayload(card)}" aria-hidden="true"></canvas>`;
          }
          function cardStudioRuntimeTheme(card){return globalThis.WWELegacyCardFaceRenderer?.themeForSet?.(card?.setId)??{};}
          function paintCardStudioInk(canvas,card){
            if(!canvas||!card)return;
            const ctx=canvas.getContext("2d");if(!ctx)return;ctx.clearRect(0,0,680,1000);
            const renderer=globalThis.WWELegacyCardFaceRenderer;
            if(!renderer)throw new Error("Shared Card Studio face renderer is not loaded.");
            renderer.drawFace(ctx,card,{width:680,height:1000,theme:cardStudioRuntimeTheme(card),nameplateProfile:SUPERSTAR_NAMEPLATE_PROFILES[card?.superstarId]??null,drawPlaque:false,drawInk:true,drawStars:true});
          }
          '''
          path.write_text(text[:start]+replacement+text[end:])
          PY
          npm run stamp-cache

      - name: Verify release
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            test/v1148-shared-card-face-renderer.test.js \
            test/v1146-card-studio-canvas-source-of-truth.test.js \
            test/v1138-card-studio-runtime-animation-layering.test.js \
            test/v1135-presentation-source-of-truth.test.js
          npm run flow
          npm run validate
          npm run card-ids

      - name: Publish v1.1.48 to main
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p \"JSON.parse(require('fs').readFileSync('build.json','utf8')).version\")" = "1.1.48"
          rm -rf .deploy-v1148
          rm -f .github/workflows/deploy-v1148.yml
          git config user.name "WWE Legacy Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No release changes to commit."; exit 1; }
          git commit -m "WWE Legacy v1.1.48 — Shared Dynamic Card Face Renderer"
          git push origin HEAD:main
