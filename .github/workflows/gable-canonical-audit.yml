name: Chad Gable canonical audit
on:
  push:
    paths:
      - '.github/gable-canonical-audit-trigger'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate canonical Gable population
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# Chad Gable canonical source audit'
            echo
            echo 'Generated from main by exact repository grep.'
            echo
            grep -RniE 'chad-gable|Chad Gable|Chaos Theory|Shoosh!|Gable.s Ankle Lock|Gable.*Moonsault' js --include='*.js' || true
          } > .github/gable-canonical-audit.txt
      - name: Commit report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/gable-canonical-audit.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Audit Chad Gable canonical card sources'
          git push
