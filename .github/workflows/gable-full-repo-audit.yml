name: Chad Gable full repository audit
on:
  push:
    paths: ['.github/gable-full-repo-audit-trigger']
permissions: {contents: write}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Locate exact live RAW1 Gable source files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/gable-source-files.txt
          pattern='RAW1-018|RAW1-019|RAW1-020|RAW1-021|RAW1-022|RAW1-037|Chaos Theory|Shoosh!|Ready, Willing and Gable|Gable.s Ankle Lock|Gable.s Moonsault'
          grep -RIlE "$pattern" . \
            --exclude-dir=.git \
            --exclude='gable-full-repo-audit.txt' \
            --exclude='gable-source-files.txt' \
            --exclude='gable-full-repo-audit.yml' \
            --exclude='gable-full-repo-audit-trigger' \
            | sort -u > /tmp/gable-files.txt || true
          {
            echo '# Exact RAW1 Chad Gable source files'
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              echo "FILE: $file"
              grep -nE "$pattern" "$file" | head -40 || true
              echo
            done < /tmp/gable-files.txt
          } > .github/gable-source-files.txt
          grep -q '^FILE:' .github/gable-source-files.txt
      - name: Commit compact report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/gable-source-files.txt
          git commit -m 'Identify canonical RAW1 Chad Gable files'
          git push origin main
