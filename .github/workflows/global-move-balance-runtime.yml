name: Global move balance and printing runtime
on:
  push:
    paths: ['.github/global-move-balance-runtime-trigger']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Locate combat runtime and balance outliers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          pats=[r'\.damage\b',r'playCard',r'resolveMove',r'printingStats',r'gameplayStatsForPrinting',r'printingTier']
          for p in Path('js').rglob('*.js'):
            s=p.read_text(errors='ignore')
            hits=[]
            for n,line in enumerate(s.splitlines(),1):
              if any(re.search(x,line,re.I) for x in pats): hits.append((n,line.strip()))
            if hits:
              print('FILE',p)
              for n,line in hits[:35]: print(f'{n}: {line[:240]}')
          PY
      - name: Run tier audit
        run: |
          set -euo pipefail
          node --check js/data/content.js
          if [ -f tools/full-card-tier-audit.mjs ]; then node tools/full-card-tier-audit.mjs; fi
