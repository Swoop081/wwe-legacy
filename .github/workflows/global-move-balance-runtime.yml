name: Global move balance and printing runtime
on:
  push:
    paths: ['.github/global-move-balance-runtime-trigger']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Report live non-finisher damage outliers
        run: |
          node --input-type=module <<'NODE'
          const {allGameplayCards}=await import('./js/data/content.js');
          const moves=allGameplayCards.filter(c=>c.kind==='move' && !c.finisher && !c.submission && c.moveType!=='submission');
          const out=moves.filter(c=>Number(c.damage)>=12).sort((a,b)=>Number(b.damage)-Number(a.damage)||String(a.id).localeCompare(String(b.id)));
          console.log('NON_FINISHER_DAMAGE_12_PLUS',out.length);
          for(const c of out) console.log(JSON.stringify({id:c.id,name:c.name,damage:c.damage,cost:c.cost,trademark:!!c.trademark,superstarId:c.superstarId??null,requirements:c.requirements??{},effects:c.effects??[],groundOpponent:!!c.groundOpponent,selfDamage:c.selfDamage??0,setId:c.setId,printingStats:c.printingStats??null}));
          NODE
      - name: Run tier audit
        run: |
          set -euo pipefail
          if [ -f tools/full-card-tier-audit.mjs ]; then node tools/full-card-tier-audit.mjs; fi
