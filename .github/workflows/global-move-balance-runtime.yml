name: Global move balance and printing runtime
on:
  push:
    paths: ['.github/global-move-balance-runtime-trigger']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Wire owned printing stats into live combat
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('js/engine/MatchEngine.js'); s=p.read_text()
          imp='import { gameplayStatsForPrinting } from "../data/reward-printings.js?v=1.1.132";'
          if imp not in s:
            anchor='import { linkedGameplayCards } from "../data/content.js?v=1.1.132";'
            if anchor not in s: raise SystemExit('MatchEngine content import anchor not found')
            s=s.replace(anchor,anchor+'\n'+imp,1)
          helper='const combatPrintingTier=card=>card?.printingTier??card?.gameplayPrintingTier??card?.ownedTier??card?.gemTier??card?.rarityTier??card?.fixedPrintingTier??"base";'
          if helper not in s:
            anchor='const other=id=>id==="p1"?"p2":"p1";'
            if anchor not in s: raise SystemExit('MatchEngine helper anchor not found')
            s=s.replace(anchor,anchor+'\n'+helper,1)
          old='_setup(pid,star,deckCards=[]){const cards=deckCards.map(cloneCard),lead=cards.splice(0,Math.min(5,cards.length));'
          new='_setup(pid,star,deckCards=[]){const cards=deckCards.map(card=>gameplayStatsForPrinting(cloneCard(card),combatPrintingTier(card))),lead=cards.splice(0,Math.min(5,cards.length));'
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('MatchEngine setup anchor not found')
          p.write_text(s)
          PY
      - name: Validate printing-aware combat
        run: |
          set -euo pipefail
          node --check js/engine/MatchEngine.js
          node --input-type=module <<'NODE'
          import { allGameplayCards } from './js/data/content.js';
          import { gameplayStatsForPrinting } from './js/data/reward-printings.js';
          const liv=allGameplayCards.find(c=>c.id==='liv-morgan-oblivion');
          if(!liv) throw new Error('Liv Morgan Oblivion not found');
          const expected={base:12,emerald:13,sapphire:14,ruby:15,amethyst:16};
          for(const [tier,damage] of Object.entries(expected)){
            const resolved=gameplayStatsForPrinting(liv,tier);
            if(resolved.damage!==damage) throw new Error(`Oblivion ${tier}: expected ${damage}, got ${resolved.damage}`);
          }
          console.log('PASS Oblivion live printing curve 12/13/14/15/16');
          NODE
          if [ -f tools/full-card-tier-audit.mjs ]; then node tools/full-card-tier-audit.mjs; fi
      - name: Commit verified runtime
        run: |
          set -euo pipefail
          git config user.name 'WWE Legacy Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add js/engine/MatchEngine.js
          git diff --cached --check
          git commit -m 'Use owned card printing stats in live combat'
          git push origin main
