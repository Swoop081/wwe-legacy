name: Inspect AI Hotspots Temp
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-ai-hotspots-temp.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Print AI hotspots and action effects
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const ai=fs.readFileSync('js/ai/WrestlingAI.js','utf8');
          for (const q of ["state.phase==='COUNTER'","state.phase===\"COUNTER\"","SUBMISSION_MAINTAIN","function counterScore","function cpuDecision"]){
            let i=ai.indexOf(q); if(i>=0) console.log('\n### '+q+'\n'+ai.slice(Math.max(0,i-1800),Math.min(ai.length,i+4200)));
          }
          const content=fs.readFileSync('js/data/content.js','utf8');
          for (const n of ['Fénix Rising','Dangerous Queen','HIM','The House That AJ Styles Built','Eat. Sleep. Conquer. Repeat.','Day One Ish','Give Me a Hell Yeah!']){
            const i=content.indexOf(n); console.log('\n### '+n+'\n'+(i>=0?content.slice(Math.max(0,i-500),Math.min(content.length,i+1200)):'NOT FOUND'));
          }
          NODE
