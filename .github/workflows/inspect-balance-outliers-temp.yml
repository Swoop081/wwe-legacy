name: Inspect Balance Outliers Temp
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-balance-outliers-temp.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Inspect Giulia and missing finishers
        run: |
          node --input-type=module <<'NODE'
          import { superstars } from './js/data/superstars.js';
          import { decks, deckIds } from './js/data/decks.js';
          import { allGameplayCards } from './js/data/content.js';
          for(const id of ['giulia','kane','the-undertaker','undertaker']){
            const s=superstars[id]; if(s) console.log('STAR',id,JSON.stringify(s));
            if(deckIds[id]) console.log('DECK',id,JSON.stringify(deckIds[id]));
            const cards=allGameplayCards.filter(c=>c.superstarId===id||c.allowedSuperstarIds?.includes?.(id));
            console.log('CARDS',id,JSON.stringify(cards.map(c=>({id:c.id,name:c.name,kind:c.kind,cost:c.cost,damage:c.damage,finisher:c.finisher,trademark:c.trademark,submission:c.submission,effect:c.effect,rulesText:c.rulesText}))));
          }
          NODE
