name: Inspect Giulia Balance Temp

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/inspect-giulia-balance-temp.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect Giulia deck mechanics
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { superstars } from './js/data/superstars.js';
          import { decks } from './js/data/decks.js';
          import { moveEligibility } from './js/engine/rules.js';
          const d=decks['giulia'];
          const counts={kind:{},method:{},finishers:0,trademarks:0,totalDamage:0,moves:0};
          for(const c of d){counts.kind[c.kind]=(counts.kind[c.kind]||0)+1;if(c.kind==='move'){counts.moves++;counts.method[c.method||'none']=(counts.method[c.method||'none']||0)+1;counts.totalDamage+=c.damage||0;if(c.finisher)counts.finishers++;if(c.trademark)counts.trademarks++;}}
          console.log('SUMMARY',JSON.stringify(counts));
          console.log('MOVES',JSON.stringify(d.filter(c=>c.kind==='move').map(c=>({id:c.id,name:c.name,method:c.method,cost:c.cost,damage:c.damage,requirements:c.requirements,finisher:!!c.finisher,trademark:!!c.trademark,groundedOnly:!!c.groundedOnly,standingOnly:!!c.standingOnly}))));
          console.log('MOMENTUM',JSON.stringify(d.filter(c=>c.kind==='momentum').map(c=>({id:c.id,method:c.method,amount:c.amount}))));
          console.log('STAR',JSON.stringify(superstars['giulia']));
          NODE
