name: Inspect Giulia Source Temp
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-giulia-source-temp.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Giulia source context
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('js/data/decks.js').read_text()
          for token in ['giulia-hammerlock-michinoku-driver','giulia-northern-lights-bomb']:
            i=s.find(token)
            print('TOKEN',token,'INDEX',i)
            print(s[max(0,i-1800):i+1800])
          PY
