name: Live Pages boot smoke
on:
  push:
    paths:
      - '.github/workflows/live-pages-boot-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Exercise deployed boot and Play Now
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'});
            const errors=[];
            page.on('console',m=>{ if(m.type()==='error') errors.push('CONSOLE '+m.text()); });
            page.on('pageerror',e=>errors.push('PAGEERROR '+(e.stack||e.message)));
            page.on('requestfailed',r=>errors.push('REQUESTFAILED '+r.url()+' '+(r.failure()?.errorText||'')));
            const url='https://swoop081.github.io/wwe-legacy/?boot-smoke='+Date.now();
            const response=await page.goto(url,{waitUntil:'networkidle',timeout:60000});
            console.log('HTTP',response?.status(),'URL',page.url());
            console.log('BOOT_VERSION',await page.evaluate(()=>window.__WWE_LEGACY_BOOT_VERSION__));
            console.log('BODY_SCREEN',await page.evaluate(()=>document.body.dataset.screen||''));
            console.log('GAME_HTML', (await page.locator('#game').innerHTML()).slice(0,1200));
            console.log('ERRORS_BEFORE',JSON.stringify(errors));
            const splash=page.locator('.launch-poster-splash');
            console.log('SPLASH_COUNT',await splash.count());
            if(await splash.count()) {
              const box=await splash.boundingBox();
              console.log('SPLASH_BOX',JSON.stringify(box));
              if(box) await page.mouse.click(box.x+box.width/2,box.y+box.height*0.9);
              await page.waitForTimeout(1500);
            }
            console.log('AFTER_SCREEN',await page.evaluate(()=>document.body.dataset.screen||''));
            console.log('AFTER_GAME_HTML',(await page.locator('#game').innerHTML()).slice(0,1200));
            console.log('ERRORS_AFTER',JSON.stringify(errors));
            await browser.close();
            if(errors.some(e=>e.startsWith('PAGEERROR'))) process.exit(2);
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
