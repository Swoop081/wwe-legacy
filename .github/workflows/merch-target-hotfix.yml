name: Merch Target Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/merch-target-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Stage merch target hotfix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply targeted Merch correction
        run: node tools/apply-merch-target-hotfix.mjs
      - name: Verify targeted Merch behavior
        run: |
          node --input-type=module <<'NODE'
          import { GENERIC_MERCH, grantMerch, equipMerch, activeMerchItem, merchMatchModifier, activeMerchSuperstarId } from './js/data/merch.js';
          const profile={starterId:'roman-reigns',unlockedSuperstars:['roman-reigns','cm-punk'],ownedMerch:{},activeMerch:null};
          const item=GENERIC_MERCH[0];
          grantMerch(profile,item.id,1);
          equipMerch(profile,item.id,'roman-reigns');
          if(activeMerchSuperstarId(profile)!=='roman-reigns') throw new Error('Target was not persisted');
          if(!activeMerchItem(profile,'roman-reigns')) throw new Error('Target Superstar lost its Merch');
          if(activeMerchItem(profile,'cm-punk')) throw new Error('Merch leaked to a different Superstar');
          if(!merchMatchModifier(profile,'roman-reigns')) throw new Error('Target Superstar did not receive modifier');
          if(merchMatchModifier(profile,'cm-punk')) throw new Error('Modifier leaked to a different Superstar');
          if(merchMatchModifier(profile)) throw new Error('Modifier can be applied without an explicit Superstar target');
          console.log('PASS: Merch applies only to its assigned Superstar.');
          NODE
      - name: Commit correction
        run: |
          git config user.name "Swoop081"
          git config user.email "justinbelot8@gmail.com"
          git add js/data/merch.js js/ui/app.js
          git commit -m "Fix Merch assignment to one Superstar"
          git push origin HEAD:main
