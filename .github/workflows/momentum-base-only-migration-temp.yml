name: Momentum Base Only Migration Temp
on: [push]
permissions:
  contents: write
jobs:
  migrate:
    if: github.event.head_commit.message == 'Fix Momentum migration workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Commit
        run: |
          git config user.name Swoop081
          git config user.email justinbelot8@gmail.com
          git add js/data/variants.js js/data/profile.js
          git commit -m 'Make Momentum Base-only and migrate existing decks'
          git push
