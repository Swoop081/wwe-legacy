name: Parallel System Audits Temp

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/parallel-system-audits-temp.yml'

permissions:
  contents: read

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        script:
          - full-card-tier-audit.mjs
          - ai-action-usage-audit.mjs
          - ai-auto-selection-audit.mjs
          - ai-behind-recovery-audit.mjs
          - ai-choice-audit.mjs
          - ai-counter-passivity-audit.mjs
          - ai-defense-passivity-audit.mjs
          - ai-pin-timing-audit.mjs
          - ai-special-usage-audit.mjs
          - ai-submission-strategy-audit.mjs
          - ai-support-usage-audit.mjs
          - architecture-audit-temp.mjs
          - art-audit.mjs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run ${{ matrix.script }}
        run: node tools/${{ matrix.script }}
