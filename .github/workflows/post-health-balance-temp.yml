name: Post Health Balance Temp
on:
  push:
    branches: [main]
    paths: ['.github/workflows/post-health-balance-temp.yml']
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Targeted Giulia sample
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { superstars } from './js/data/superstars.js';
          import { decks } from './js/data/decks.js';
          import { MatchEngine } from './js/engine/MatchEngine.js';
          import { decisionOwner,cpuDecision,executeCpuDecision } from './js/ai/WrestlingAI.js';
          const stars=Object.values(superstars),g=stars.find(x=>x.id==='giulia');
          const rng=seed=>{let x=seed>>>0;return()=>{x=(x*1664525+1013904223)>>>0;return x/4294967296;};};
          let w=0,l=0,stalls=0,turns=0,match=0,finishes={};
          function play(a,b,seed,giuliaP1){const e=new MatchEngine({p1:a,p2:b,decks,rng:rng(seed)});let steps=0;while(e.state().phase!=='MATCH_OVER'&&steps++<1600){const pid=decisionOwner(e.state());if(!pid)break;const d=cpuDecision(e,pid);if(!d||!executeCpuDecision(e,d,pid))break;}const s=e.state();match++;turns+=s.turnNumber;if(s.phase!=='MATCH_OVER'){stalls++;return;}finishes[s.finish?.type]=(finishes[s.finish?.type]||0)+1;const won=giuliaP1?s.winner==='p1':s.winner==='p2';if(won)w++;else l++;}
          let n=0;for(let pass=0;pass<3;pass++)for(const opp of stars){if(opp.id==='giulia')continue;play(g,opp,700000+n*41,true);play(opp,g,900000+n*43,false);n++;}
          console.log('GIULIA',JSON.stringify({matches:match,wins:w,losses:l,winPct:+(100*w/Math.max(1,w+l)).toFixed(1),stalls,avgTurns:+(turns/match).toFixed(2),finishes}));
          NODE
      - name: Whole-roster multi-seed matrix
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { superstars } from './js/data/superstars.js';
          import { decks } from './js/data/decks.js';
          import { MatchEngine } from './js/engine/MatchEngine.js';
          import { decisionOwner,cpuDecision,executeCpuDecision } from './js/ai/WrestlingAI.js';
          const stars=Object.values(superstars),N=stars.length,rng=seed=>{let x=seed>>>0;return()=>{x=(x*1664525+1013904223)>>>0;return x/4294967296;};};
          const r=Object.fromEntries(stars.map(s=>[s.id,{name:s.name,w:0,l:0}]));let matches=0,stalls=0,turns=0;const finishes={};
          function play(a,b,seed){const g=new MatchEngine({p1:a,p2:b,decks,rng:rng(seed)});let steps=0;while(g.state().phase!=='MATCH_OVER'&&steps++<1600){const pid=decisionOwner(g.state());if(!pid)break;const d=cpuDecision(g,pid);if(!d||!executeCpuDecision(g,d,pid))break;}const s=g.state();matches++;turns+=s.turnNumber;if(s.phase!=='MATCH_OVER'){stalls++;return;}finishes[s.finish?.type]=(finishes[s.finish?.type]||0)+1;if(s.winner==='p1'){r[a.id].w++;r[b.id].l++;}else{r[b.id].w++;r[a.id].l++;}}
          const offsets=[1,7,17,31,47];for(let pass=0;pass<4;pass++)for(let i=0;i<N;i++)for(let k=0;k<offsets.length;k++){const j=(i+offsets[k])%N;if(i===j)continue;play(stars[i],stars[j],1100003+pass*100003+i*997+k*31);play(stars[j],stars[i],2100003+pass*120011+i*991+k*37);}
          const table=Object.entries(r).map(([id,x])=>({id,name:x.name,matches:x.w+x.l,wins:x.w,losses:x.l,winPct:+(100*x.w/Math.max(1,x.w+x.l)).toFixed(1)})).sort((a,b)=>b.winPct-a.winPct);
          console.log('WHOLE',JSON.stringify({stars:N,matches,stalls,avgTurns:+(turns/matches).toFixed(2),finishes,top10:table.slice(0,10),bottom10:table.slice(-10).reverse(),giulia:table.find(x=>x.id==='giulia'),cmPunk:table.find(x=>x.id==='cm-punk'),roman:table.find(x=>x.id==='roman-reigns'),kendal:table.find(x=>x.id==='kendal-grey')}));
          NODE
