name: Printing aware combat integration
on:
  push:
    paths: ['.github/printing-aware-combat-trigger']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Author canonical finisher curves and wire them into playable cards
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('js/shared/v1.1.69-card-identity-pass.js'); s=p.read_text()
          old="""function enforceAuditedMoveStructure(card){\n  if(card?.finisher){ card.method=null; card.requirements={}; }"""
          new="""const EXCEPTIONAL_FINISHER_IDS=new Set(['brock-lesnar-f-5']);\nconst LOWER_FINISHER_IDS=new Set([]);\nfunction ensureFinisherPrintingCurve(card){\n  if(!card?.finisher || card?.moveType==='submission' || card?.submission || card?.printingStats) return;\n  const damage=EXCEPTIONAL_FINISHER_IDS.has(card.id) ? [13,14,15,16,17] : LOWER_FINISHER_IDS.has(card.id) ? [11,12,13,14,15] : [12,13,14,15,16];\n  card.printingStats={base:{damage:damage[0]},emerald:{damage:damage[1]},sapphire:{damage:damage[2]},ruby:{damage:damage[3]},amethyst:{damage:damage[4]}};\n}\nfunction enforceAuditedMoveStructure(card){\n  if(card?.finisher){ card.method=null; card.requirements={}; ensureFinisherPrintingCurve(card); }"""
          if old not in s: raise SystemExit('finisher structure target not found')
          p.write_text(s.replace(old,new,1))

          p=Path('js/data/variants.js'); s=p.read_text()
          old="""    out.damage=Math.max(0,authoredDamage+damageOffset);\n    out.cost=Math.max(card.defensiveOnly?0:1,authoredCost+costOffset);\n    out.effects=scaleEffectArray(card.effects,moveEffectDelta);"""
          new="""    const printingKey = resolvedTier === 'normal' ? 'base' : resolvedTier;\n    const printingSpec = card.printingStats?.[printingKey] ?? null;\n    out.damage=Number.isFinite(Number(printingSpec?.damage)) ? Math.max(0,Number(printingSpec.damage)) : Math.max(0,authoredDamage+damageOffset);\n    out.cost=Number.isFinite(Number(printingSpec?.cost)) ? Math.max(card.defensiveOnly?0:1,Number(printingSpec.cost)) : Math.max(card.defensiveOnly?0:1,authoredCost+costOffset);\n    out.tierDamageOffset=out.damage-authoredDamage;\n    out.tierCostOffset=out.cost-authoredCost;\n    out.effects=scaleEffectArray(card.effects,moveEffectDelta);"""
          if old not in s: raise SystemExit('applyCardTier target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Validate exact printing curves and runtime
        run: |
          set -euo pipefail
          node --check js/data/variants.js
          node --check js/shared/v1.1.69-card-identity-pass.js
          node tools/full-card-tier-audit.mjs
          node --input-type=module <<'JS'
          import { allGameplayCards } from './js/data/content.js';
          import { applyCardTier } from './js/data/variants.js';
          const checks=[['liv-morgan-oblivion',[12,13,14,15,16]],['becky-lynch-manhandle-slam',[12,13,14,15,16]],['chelsea-green-im-prettier',[12,13,14,15,16]],['damian-priest-south-of-heaven',[12,13,14,15,16]],['brock-lesnar-f-5',[13,14,15,16,17]]];
          const tiers=['normal','emerald','sapphire','ruby','amethyst'];
          for(const [id,want] of checks){const card=allGameplayCards.find(c=>c.id===id);if(!card)throw new Error(`Missing ${id}`);const got=tiers.map(t=>applyCardTier(card,t).damage);if(got.join(',')!==want.join(','))throw new Error(`${id}: ${got} != ${want}`);console.log(id,got.join('/'));}
          const finishers=allGameplayCards.filter(c=>c.kind==='move'&&c.finisher&&!c.submission&&c.moveType!=='submission');
          for(const card of finishers){const got=tiers.map(t=>applyCardTier(card,t).damage);if(got.some((n,i)=>i&&n<got[i-1]))throw new Error(`Non-progressive finisher ${card.id}: ${got}`);}
          console.log('damaging finishers validated',finishers.length);
          JS
      - name: Commit
        run: |
          git config user.name 'WWE Legacy Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add js/data/variants.js js/shared/v1.1.69-card-identity-pass.js
          git diff --cached --check
          git commit -m 'Apply exact rarity curves to live combat' || exit 0
          git push origin main
