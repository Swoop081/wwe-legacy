name: Remove NG1-075 Bulldogs Crucifix
on:
  push:
    paths: ['.github/remove-ng1-075-trigger-v2']
permissions:
  contents: write
jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Remove exact NG1-075 card
        shell: python
        run: |
          from pathlib import Path
          import re,json
          mp=Path('js/data/card-number-manifest.js'); ms=mp.read_text()
          m=re.search(r'\{\s*"id":\s*"([^"]+)"[^{}]*"cardCode":\s*"NG1-075"\s*\}',ms,re.S)
          if not m: raise SystemExit('NG1-075 not found in manifest')
          cid=m.group(1)
          cp=Path('js/data/content.js'); s=cp.read_text(); pos=s.find('"id": "'+cid+'"')
          if pos<0: raise SystemExit('NG1-075 gameplay object not found')
          a=s.rfind('{',0,pos); obj,end=json.JSONDecoder().raw_decode(s[a:])
          if 'crucifix' not in str(obj.get('name','')).lower() or obj.get('superstarId')!='british-bulldog': raise SystemExit('Identity guard failed')
          b=a+end
          while b<len(s) and s[b] in ' \t\r\n': b+=1
          if b<len(s) and s[b]==',': b+=1
          cp.write_text(s[:a].rstrip()+"\n"+s[b:].lstrip())
          for p in Path('js/data').glob('*.js'):
            if p in (cp,mp): continue
            t=p.read_text(); nt=re.sub(r'(["\'])'+re.escape(cid)+r'\1\s*,?\s*','',t)
            if nt!=t: p.write_text(nt)
          pos=ms.find('"cardCode": "NG1-075"'); a=ms.rfind('{',0,pos); _,end=json.JSONDecoder().raw_decode(ms[a:]); b=a+end
          while b<len(ms) and ms[b] in ' \t\r\n': b+=1
          if b<len(ms) and ms[b]==',': b+=1
          mp.write_text(ms[:a].rstrip()+"\n"+ms[b:].lstrip())
      - name: Regenerate and verify
        run: |
          node tools/generate-card-studio-data.mjs
          ! grep -q 'NG1-075' js/data/content.js
          ! grep -q 'NG1-075' js/data/card-number-manifest.js
          ! grep -q 'NG1-075' js/tools/card-art-studio-data.js
      - name: Commit
        run: |
          git config user.name "WWE Legacy Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add js/data js/tools/card-art-studio-data.js
          git commit -m "Remove British Bulldog Crucifix NG1-075"
          git push origin main
