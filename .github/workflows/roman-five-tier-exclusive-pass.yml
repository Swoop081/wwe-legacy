name: Roman exclusive five-tier pass
on:
  push:
    paths: ['.github/roman-five-tier-exclusive-trigger']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Apply and certify Roman exclusive curves
        run: python3 tools/roman-five-tier-exclusive-pass.py
      - name: Commit certified Roman curves
        run: |
          git config user.name 'WWE Legacy Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add js/shared/v1.1.69-card-identity-pass.js
          git diff --cached --check
          git commit -m 'Lock Roman Reigns exclusive five-tier curves'
          git push origin main
