name: Roman Ooh Ahh runtime pass
on:
  push:
    paths: ['.github/roman-ooh-ahh-runtime-trigger']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Apply and certify Ooh Ahh runtime
        run: python3 tools/roman-ooh-ahh-runtime-pass.py
      - name: Syntax check engine and content
        run: |
          node --check js/engine/MatchEngine.js
          node --check js/data/content.js
      - name: Commit Ooh Ahh runtime
        run: |
          git config user.name 'WWE Legacy Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add js/data/content.js js/engine/MatchEngine.js
          git diff --cached --check
          git commit -m 'Lock Ooh Ahh Spear protection gameplay'
          git push origin main
