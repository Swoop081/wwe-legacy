name: Shared five-tier batch 1
on:
  push:
    paths: ['.github/shared-five-tier-batch-1-trigger']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Apply and certify shared curves
        run: python3 tools/shared-five-tier-batch-1.py
      - name: Commit certified shared curves
        run: |
          git config user.name 'WWE Legacy Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add js/shared/v1.1.69-card-identity-pass.js
          git diff --cached --check
          git commit -m 'Lock first shared five-tier move batch'
          git push origin main
