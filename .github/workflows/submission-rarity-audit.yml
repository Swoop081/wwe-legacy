name: Full submission rarity audit
on:
  push:
    paths: ['.github/submission-rarity-audit-trigger']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Audit every gameplay submission and rarity plumbing
        run: |
          set -euo pipefail
          echo '=== SUBMISSION DEFINITIONS ==='
          grep -RniE "moveType:[[:space:]]*['\"]submission|\"moveType\"[[:space:]]*:[[:space:]]*\"submission\"|submission:[[:space:]]*\{|\"submission\"[[:space:]]*:" js --include='*.js' | tee /tmp/submissions.txt || true
          echo '=== PRINTING STATS AROUND SUBMISSIONS ==='
          grep -RniE -B8 -A18 "moveType:[[:space:]]*['\"]submission|\"moveType\"[[:space:]]*:[[:space:]]*\"submission\"|submission:[[:space:]]*\{|\"submission\"[[:space:]]*:" js/data js/shared --include='*.js' | tee /tmp/submission-context.txt || true
          echo '=== SUBMISSION RUNTIME ==='
          grep -RniE "persistent|pressure|submission|printingStats|gameplayStatsForPrinting" js --include='*.js' | tee /tmp/submission-runtime.txt || true
          echo '=== SUMMARY ==='
          echo "definition matches: $(wc -l < /tmp/submissions.txt)"
          test -s /tmp/submissions.txt
