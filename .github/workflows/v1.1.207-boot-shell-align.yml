name: v1.1.207 boot shell alignment
on:
  push:
    paths:
      - '.github/workflows/v1.1.207-boot-shell-align.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Align every boot-shell cache key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('1.1.205','1.1.207').replace('1.1.206','1.1.207')
          p.write_text(s)
          PY
          grep -q 'window.__WWE_LEGACY_BOOT_VERSION__="1.1.207"' index.html
          grep -q './js/runtime/current.js?v=1.1.207' index.html
      - name: Commit aligned shell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'v1.1.207 align launch shell with isolated runtime'
          git push origin HEAD:main
