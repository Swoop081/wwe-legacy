name: WWE Legacy Card Studio Gold Frames

on:
  push:
    paths:
      - '.card-studio-gold/READY'

permissions:
  contents: write

concurrency:
  group: wwe-legacy-card-studio-gold-frames
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Card Studio gold identity frame treatment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          studio_path = Path('js/tools/card-art-studio.js')
          studio = studio_path.read_text()
          pattern = re.compile(r'const\s+meta\s*=\s*PRINTING_TIER_FRAMES\[selectedPrintingTier\(\)\]\s*\|\|\s*PRINTING_TIER_FRAMES\.normal\s*,\s*w\s*=\s*canvas\.width\s*,\s*h\s*=\s*canvas\.height\s*,\s*s\s*=\s*scale\(\)\s*;')
          replacement = 'const selectedFrame=PRINTING_TIER_FRAMES[selectedPrintingTier()]||PRINTING_TIER_FRAMES.normal,frameCard=currentCard(),meta=(frameCard?.kind==="superstar"||frameCard?.kind==="entrance")?{label:"Gold",color:"#d6ad37",dark:"#8f6716",highlight:"rgba(255,244,190,.92)"}:selectedFrame,w=canvas.width,h=canvas.height,s=scale();'
          studio, count = pattern.subn(replacement, studio, count=1)
          if count != 1:
              raise SystemExit(f'Expected exactly one Card Studio physical-frame assignment, replaced {count}')
          studio_path.write_text(studio)

          pkg_path = Path('package.json')
          pkg = json.loads(pkg_path.read_text())
          if pkg.get('version') != '1.1.101':
              raise SystemExit(f"Expected v1.1.101, found {pkg.get('version')}")
          pkg['version'] = '1.1.102'
          pkg_path.write_text(json.dumps(pkg, indent=2) + '\n')
          PY

      - name: Stamp release version and regenerate Card Studio data
        shell: bash
        run: |
          set -euo pipefail
          npm run stamp-cache
          npm run generate-studio

      - name: Verify release
        shell: bash
        run: |
          set -euo pipefail
          npm run test:current
          npm run flow
          npm run validate
          npm run card-ids
          grep -Fq 'frameCard?.kind==="superstar"||frameCard?.kind==="entrance"' js/tools/card-art-studio.js
          grep -Fq 'color:"#d6ad37",dark:"#8f6716",highlight:"rgba(255,244,190,.92)"' js/tools/card-art-studio.js
          grep -Fq '"version": "1.1.102"' package.json

      - name: Publish verified v1.1.102
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .card-studio-gold
          rm -f .github/workflows/wwe-card-studio-gold-frames.yml
          git config user.name "WWE Legacy Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No release changes to commit."; exit 1; }
          git commit -m "WWE Legacy v1.1.102 — Card Studio gold identity frames"
          git push origin HEAD:main
