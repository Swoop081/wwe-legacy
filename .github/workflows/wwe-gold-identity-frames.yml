name: WWE Legacy Gold Identity Frames

on:
  push:
    paths:
      - '.gold-frame/READY'

permissions:
  contents: write

concurrency:
  group: wwe-legacy-gold-identity-frames
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Superstar and Entrance gold frame treatment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          pkg_path = Path('package.json')
          pkg = json.loads(pkg_path.read_text())
          if pkg.get('version') != '1.1.100':
              raise SystemExit(f"Expected v1.1.100, found {pkg.get('version')}")
          pkg['version'] = '1.1.101'
          pkg_path.write_text(json.dumps(pkg, indent=2) + '\n')

          css_path = Path('css/v1.1.101-superstar-entrance-gold-frame.css')
          css_path.write_text('''/* WWE Legacy v1.1.101 — Superstar + Entrance Gold Identity Frames\n   Only the physical border changes. Artwork, tier overlays, glow, rarity, typography,\n   layout and gameplay remain untouched. */\n.ccg-card.type-superstar .ccg-print-frame,\n.ccg-card.type-entrance .ccg-print-frame {\n  border-color:#d6ad37!important;\n  box-shadow:\n    inset 0 0 0 1px rgba(255,244,190,.92),\n    0 0 0 1px #8f6716,\n    inset 0 0 12px rgba(255,255,255,.10)!important;\n}\n''')

          index_path = Path('index.html')
          index = index_path.read_text()
          marker = '  <link rel="stylesheet" href="./css/v1.1.96-card-frame-safe-zone-hotfix.css?v=1.1.100">\n'
          insert = marker + '  <link rel="stylesheet" href="./css/v1.1.101-superstar-entrance-gold-frame.css?v=1.1.101">\n'
          if 'v1.1.101-superstar-entrance-gold-frame.css' not in index:
              if marker not in index:
                  raise SystemExit('Could not locate final card-frame stylesheet marker in index.html')
              index = index.replace(marker, insert, 1)
          index_path.write_text(index)
          PY

      - name: Stamp release version and regenerate Card Studio data
        shell: bash
        run: |
          set -euo pipefail
          npm run stamp-cache
          npm run generate-studio

      - name: Verify release
        shell: bash
        run: |
          set -euo pipefail
          npm run test:current
          npm run flow
          npm run validate
          npm run card-ids
          grep -q 'v1.1.101-superstar-entrance-gold-frame.css' index.html
          grep -q 'type-superstar .ccg-print-frame' css/v1.1.101-superstar-entrance-gold-frame.css
          grep -q 'type-entrance .ccg-print-frame' css/v1.1.101-superstar-entrance-gold-frame.css

      - name: Publish verified v1.1.101
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .gold-frame
          rm -f .github/workflows/wwe-gold-identity-frames.yml
          git config user.name "WWE Legacy Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No release changes to commit."; exit 1; }
          git commit -m "WWE Legacy v1.1.101 — Superstar + Entrance gold frames"
          git push origin HEAD:main
