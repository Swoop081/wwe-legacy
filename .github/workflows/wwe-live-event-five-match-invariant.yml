name: WWE Legacy Five Match Live Event Invariant
on:
  push:
    paths:
      - '.live-event-five-match/READY'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Make five matches absolute
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/data/live-events.js')
          s=p.read_text()
          old='''    // Theme eligibility is absolute. Variety/recency may reorder an event's authored
    // opponent pool, but must never widen it (for example Evolution is women-only).
    const candidates = [...new Set(themed)].filter(id => !usedToday.has(id));
    candidates.sort((a,b) => {
      const aLast = recentUse.get(a) ?? -Infinity, bLast = recentUse.get(b) ?? -Infinity;
      if (aLast !== bLast) return aLast - bLast;
      const seed = `${dateKey(localDayStart(now))}:${event.id}:`;
      return `${seed}${a}`.localeCompare(`${seed}${b}`);
    });
    const selected = candidates.slice(0, LIVE_EVENT_LENGTH);
    selected.forEach(id => usedToday.add(id));
    return { ...event, opponentPool: selected };'''
          new='''    // Theme eligibility and five-match tower length are absolute. Daily variety is
    // only a preference: unused Superstars lead the pool, but already-used themed
    // opponents backfill when necessary so a tower can never collapse below five.
    const candidates = [...new Set(themed)];
    candidates.sort((a,b) => {
      const aLast = recentUse.get(a) ?? -Infinity, bLast = recentUse.get(b) ?? -Infinity;
      if (aLast !== bLast) return aLast - bLast;
      const seed = `${dateKey(localDayStart(now))}:${event.id}:`;
      return `${seed}${a}`.localeCompare(`${seed}${b}`);
    });
    const unused = candidates.filter(id => !usedToday.has(id));
    const reused = candidates.filter(id => usedToday.has(id));
    const ordered = [...unused, ...reused];
    if (ordered.length < LIVE_EVENT_LENGTH) {
      throw new Error(`Live Event ${event.id} has only ${ordered.length} released themed opponents; five are required.`);
    }
    ordered.slice(0, LIVE_EVENT_LENGTH).forEach(id => usedToday.add(id));
    return { ...event, opponentPool: ordered };'''
          if old not in s:
              raise SystemExit('dailyVarietyEvents target block not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Bump release
        run: |
          npm version 1.1.115 --no-git-tag-version
          npm run stamp-cache
          npm run generate-studio
      - name: Verify five-match invariant
        run: |
          npm run test:current
          npm run flow
          npm run validate
          npm run card-ids
          node --input-type=module <<'NODE'
          import { activeLiveEventTowers, LIVE_EVENT_LENGTH } from './js/data/live-events.js';
          const start = new Date(2026, 8, 1, 12, 0, 0);
          for (let day = 0; day < 120; day += 1) {
            const d = new Date(start.getTime());
            d.setDate(d.getDate() + day);
            const towers = activeLiveEventTowers(d, null);
            if (towers.length !== 3) throw new Error(`${d.toDateString()}: expected 3 daily towers, got ${towers.length}`);
            for (const tower of towers) {
              const firstFive = [...new Set(tower.event.opponentPool)].slice(0, LIVE_EVENT_LENGTH);
              if (firstFive.length !== LIVE_EVENT_LENGTH) throw new Error(`${d.toDateString()} ${tower.event.id}: expected 5 opponents, got ${firstFive.length}`);
            }
          }
          console.log('Verified exactly 3 daily towers with 5 opponents across 120 days');
          NODE
      - name: Publish
        run: |
          rm -rf .live-event-five-match
          rm -f .github/workflows/wwe-live-event-five-match-invariant.yml
          git config user.name 'Swoop081'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'WWE Legacy v1.1.115 — enforce five matches in every Live Event'
          git push origin main