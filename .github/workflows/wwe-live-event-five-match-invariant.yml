name: WWE Legacy Five Match Live Event Invariant
on:
  push:
    paths:
      - '.live-event-five-match/READY'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Make five matches absolute
        run: python3 .live-event-five-match/fix.py
      - name: Bump release
        run: |
          npm version 1.1.115 --no-git-tag-version
          npm run stamp-cache
          npm run generate-studio
      - name: Verify five-match invariant
        run: |
          npm run test:current
          npm run flow
          npm run validate
          npm run card-ids
          node tools/verify-live-event-five-match.mjs
      - name: Publish
        run: |
          rm -rf .live-event-five-match
          rm -f .github/workflows/wwe-live-event-five-match-invariant.yml
          git config user.name 'Swoop081'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'WWE Legacy v1.1.115 — enforce five matches in every Live Event'
          git push origin main