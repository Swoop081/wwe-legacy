name: WWE Legacy Live Event Nine Set Rotation
on:
  push:
    paths:
      - '.live-event-nine-set/READY'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restrict daily rotation to nine launch-set themes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/data/live-events.js')
          s=p.read_text()
          old='''export const LIVE_EVENT_ROTATION_POOL = Object.freeze([\n  ...LAUNCH_THEME_TOWERS,\n  ...THREE_DAY_TOWERS,\n  ...WEEKLY_TOWERS\n]);'''
          new='''export const LIVE_EVENT_ROTATION_POOL = Object.freeze([\n  ...LAUNCH_THEME_TOWERS\n]);'''
          if old not in s:
            raise SystemExit('rotation pool block not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Bump release version
        run: |
          npm version 1.1.113 --no-git-tag-version --allow-same-version
          node -e "const fs=require('fs');const p='build.json';const j=JSON.parse(fs.readFileSync(p));j.version='1.1.113';j.name='v1.1.113 — Nine-Set Live Event Rotation';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
          npm run stamp-cache
          npm run generate-studio
      - name: Verify release
        run: |
          npm run test:current
          npm run flow
          npm run validate
          npm run card-ids
          node --input-type=module - <<'NODE'
          import { LAUNCH_THEME_TOWERS, LIVE_EVENT_ROTATION_POOL, rotatingLiveEventTemplates, LIVE_EVENT_LENGTH } from './js/data/live-events.js';
          if (LIVE_EVENT_LENGTH !== 5) throw new Error('Live Event length must remain 5');
          if (LAUNCH_THEME_TOWERS.length !== 9) throw new Error(`Expected 9 launch themes, got ${LAUNCH_THEME_TOWERS.length}`);
          if (LIVE_EVENT_ROTATION_POOL.length !== 9) throw new Error(`Rotation must contain exactly 9 launch themes, got ${LIVE_EVENT_ROTATION_POOL.length}`);
          const ids = new Set();
          for (let day=0; day<3; day++) {
            const d = new Date(2026,7,17+day,12,0,0);
            const events = rotatingLiveEventTemplates(d);
            if (events.length !== 3) throw new Error('Expected 3 events per day');
            events.forEach(e => ids.add(e.id));
          }
          if (ids.size !== 9) throw new Error(`Three-day cycle must represent all 9 launch themes; got ${ids.size}`);
          NODE
      - name: Publish
        run: |
          rm -rf .live-event-nine-set
          rm -f .github/workflows/wwe-live-event-nine-set-rotation.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'WWE Legacy v1.1.113 — nine-set Live Event rotation'
          git push
