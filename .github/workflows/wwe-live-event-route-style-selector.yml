name: WWE Legacy Live Event Route Style Selector
on:
  push:
    paths:
      - '.live-event-route-style-selector/READY'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Make Live Event player cards match route cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('js/ui/app.js')
          s=p.read_text()
          pattern=r'''function selectionCarouselMarkup\(stars, selectedId, context, labelFor = null\) \{.*?\n\}\n\nfunction wireSelectionCarousel'''
          replacement='''function selectionCarouselMarkup(stars, selectedId, context, labelFor = null) {\n  const liveRouteStyle = context === "live-event-select" || context === "live-event-swap";\n  if (liveRouteStyle) {\n    return `<div class="superstar-select-carousel live-event-route-choice-carousel" data-carousel="${context}">${stars.map(star => {\n      const selected = star.id === selectedId;\n      return `<button type="button" class="select-superstar-card live-event-route-choice ${selected?'selected':''}" data-select-context="${context}" data-select-star="${star.id}" aria-label="${star.name}. ${selected ? 'Selected.' : 'Tap to select.'}"><span class="live-tower-route-card-frame live-event-player-choice-frame">${superstarPreviewCardMarkup(star.id,"live-tower-opponent-card")}</span></button>`;\n    }).join('')}</div>`;\n  }\n  const fav = new Set(profile?.favouriteSuperstars ?? []);\n  return `<div class="superstar-select-carousel" data-carousel="${context}">${stars.map(star => {\n    const key = `${context}:${star.id}`;\n    const flipped = selectDetailKeys.has(key);\n    const selected = star.id === selectedId;\n    return `<button type="button" class="select-superstar-card ${selected?'selected':''} ${flipped?'is-flipped':''}" data-select-context="${context}" data-select-star="${star.id}" aria-label="${star.name}. ${selected ? 'Tap again for details.' : 'Tap to select.'}"><span class="select-card-inner"><span class="select-card-face select-card-front"><span class="select-favourite">${fav.has(star.id)?'★':''}</span><span class="selection-owned-card">${superstarPreviewCardMarkup(star.id,"selection-owned-superstar-card",{preferFinished:context==="deck-lab-select"})}</span></span><span class="select-card-face select-card-back"><strong>${star.name}</strong><span>${star.nickname}</span><b>${star.hp} HP</b><small>${star.archetype.replaceAll('-', ' ')}</small><em>${star.ability?.name ?? ''}</em><p>${star.ability?.text ?? ''}</p><i>TAP AGAIN FOR CARD</i></span></span></button>`;\n  }).join('')}</div>`;\n}\n\nfunction wireSelectionCarousel'''
          ns,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'selectionCarouselMarkup replacement count {n}')
          old='''    const starId = btn.dataset.selectStar;\n    const key = `${context}:${starId}`;\n    const wasSelected = btn.classList.contains('selected');\n'''
          new='''    const starId = btn.dataset.selectStar;\n    const key = `${context}:${starId}`;\n    const liveRouteStyle = context === "live-event-select" || context === "live-event-swap";\n    if (liveRouteStyle) {\n      onPick(starId);\n      restoreScroll();\n      return;\n    }\n    const wasSelected = btn.classList.contains('selected');\n'''
          if old not in ns: raise SystemExit('wire selection insertion point not found')
          p.write_text(ns.replace(old,new,1))
          PY
          cat >> css/game.css <<'CSS'

/* v1.1.110 — Live Event owned choices are literally scaled route cards. */
body[data-screen="live-events"][data-live-view="detail"] .live-event-route-choice-carousel{
  align-items:center!important;
  gap:10px!important;
  overflow-x:auto!important;
  overflow-y:hidden!important;
  padding:4px 2px 8px!important;
}
body[data-screen="live-events"][data-live-view="detail"] .live-event-route-choice{
  appearance:none!important;
  -webkit-appearance:none!important;
  flex:0 0 min(31vw,122px)!important;
  width:min(31vw,122px)!important;
  height:auto!important;
  aspect-ratio:680/1000!important;
  padding:0!important;
  border:0!important;
  border-radius:10px!important;
  background:transparent!important;
  box-shadow:none!important;
  perspective:none!important;
  overflow:visible!important;
  scroll-snap-align:center!important;
}
body[data-screen="live-events"][data-live-view="detail"] .live-event-route-choice .live-event-player-choice-frame,
body[data-screen="live-events"][data-live-view="detail"] .live-event-route-choice .live-tower-opponent-card{
  display:block!important;
  width:100%!important;
  height:100%!important;
  max-width:100%!important;
  max-height:100%!important;
  margin:0!important;
}
body[data-screen="live-events"][data-live-view="detail"] .live-event-route-choice.selected .live-event-player-choice-frame{
  border-radius:10px!important;
  outline:2px solid var(--tower-accent,#45d8ff)!important;
  outline-offset:2px!important;
  filter:drop-shadow(0 0 7px color-mix(in srgb,var(--tower-accent,#45d8ff) 70%,transparent))!important;
}
CSS
      - name: Bump release version
        run: |
          npm version 1.1.110 --no-git-tag-version --allow-same-version
          node -e "const fs=require('fs'); const p='build.json'; const j=JSON.parse(fs.readFileSync(p)); j.version='1.1.110'; j.name='v1.1.110 — Live Event Route-Style Player Cards'; fs.writeFileSync(p, JSON.stringify(j,null,2)+'\n');"
          npm run stamp-cache
          npm run generate-studio
      - name: Verify release
        run: |
          npm run test:current
          npm run flow
          npm run validate
          npm run card-ids
          grep -q 'live-event-route-choice' js/ui/app.js
          grep -q 'scaled route cards' css/game.css
      - name: Publish
        run: |
          rm -rf .live-event-route-style-selector
          rm -f .github/workflows/wwe-live-event-route-style-selector.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'WWE Legacy v1.1.110 — Live Event route-style player cards'
          git push
