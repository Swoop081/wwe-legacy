name: WWE Legacy Live Event Theme Gate
on:
  push:
    paths:
      - '.live-event-theme-gate/READY'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Preserve event eligibility while applying variety
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/data/live-events.js')
          s=p.read_text()
          old='''    const themed = releasedLiveEventOpponentIds(event, profile, now);\n    const candidates = [...new Set([...themed, ...visibleAll])].filter(id => !usedToday.has(id));\n    candidates.sort((a,b) => {\n      const aThemed = themed.includes(a) ? 1 : 0, bThemed = themed.includes(b) ? 1 : 0;\n      const aLast = recentUse.get(a) ?? -Infinity, bLast = recentUse.get(b) ?? -Infinity;\n      if (aLast !== bLast) return aLast - bLast;\n      if (aThemed !== bThemed) return bThemed - aThemed;\n      const seed = `${dateKey(localDayStart(now))}:${event.id}:`;\n      return `${seed}${a}`.localeCompare(`${seed}${b}`);\n    });\n'''
          new='''    const themed = releasedLiveEventOpponentIds(event, profile, now);\n    // Theme eligibility is absolute. Variety/recency may reorder an event's authored\n    // opponent pool, but must never widen it (for example Evolution is women-only).\n    const candidates = [...new Set(themed)].filter(id => !usedToday.has(id));\n    candidates.sort((a,b) => {\n      const aLast = recentUse.get(a) ?? -Infinity, bLast = recentUse.get(b) ?? -Infinity;\n      if (aLast !== bLast) return aLast - bLast;\n      const seed = `${dateKey(localDayStart(now))}:${event.id}:`;\n      return `${seed}${a}`.localeCompare(`${seed}${b}`);\n    });\n'''
          if old not in s: raise SystemExit('daily variety widening block not found')
          s=s.replace(old,new)
          # Remove now-unused all-roster fallback declaration.
          s=s.replace('''  const visibleAll = Object.values(superstars).filter(star => isPlayerVisibleSuperstar(star, profile, now)).map(star => star.id);\n''','')
          p.write_text(s)
          PY
      - name: Bump release version
        run: |
          npm version 1.1.108 --no-git-tag-version --allow-same-version
          node -e "const fs=require('fs'); const p='build.json'; const j=JSON.parse(fs.readFileSync(p)); j.version='1.1.108'; j.name='v1.1.108 — Live Event Theme Eligibility Gate'; fs.writeFileSync(p, JSON.stringify(j,null,2)+'\n');"
          npm run stamp-cache
          npm run generate-studio
      - name: Verify release
        run: |
          npm run test:current
          npm run flow
          npm run validate
          npm run card-ids
          grep -q 'const candidates = \[...new Set(themed)\]' js/data/live-events.js
          ! grep -q '\[...themed, ...visibleAll\]' js/data/live-events.js
      - name: Publish
        run: |
          rm -rf .live-event-theme-gate
          rm -f .github/workflows/wwe-live-event-theme-gate.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'WWE Legacy v1.1.108 — preserve Live Event theme eligibility'
          git push
