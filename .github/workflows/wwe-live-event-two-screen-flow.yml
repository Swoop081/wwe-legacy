name: WWE Legacy Live Event Two Screen Flow
on:
  push:
    paths:
      - '.live-event-two-screen/READY'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply Live Event patch
        run: git apply .live-event-two-screen/change.patch
      - name: Apply Live Event layout
        run: cat .live-event-two-screen/layout.css >> css/game.css
      - name: Bump release version
        run: npm version 1.1.111 --no-git-tag-version --allow-same-version
      - name: Update build manifest
        run: node -e "const fs=require('fs');const p='build.json';const j=JSON.parse(fs.readFileSync(p));j.version='1.1.111';j.name='v1.1.111 — Live Event Two-Screen Match Flow';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\\n')"
      - name: Stamp cache
        run: npm run stamp-cache
      - name: Generate Card Studio data
        run: npm run generate-studio
      - name: Verify current tests
        run: npm run test:current
      - name: Verify flow
        run: npm run flow
      - name: Verify rebuild
        run: npm run validate
      - name: Verify card ids
        run: npm run card-ids
      - name: Verify Live Event redesign
        run: grep -q 'live-event-matchup-screen' js/ui/app.js && grep -q 'route first, matchup second' css/game.css
      - name: Publish
        run: rm -rf .live-event-two-screen && rm -f .github/workflows/wwe-live-event-two-screen-flow.yml && git config user.name github-actions[bot] && git config user.email 41898282+github-actions[bot]@users.noreply.github.com && git add -A && git commit -m 'WWE Legacy v1.1.111 — Live Event two-screen match flow' && git push
