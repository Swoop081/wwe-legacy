name: WWE Legacy v1.1.124 iPhone Pack Crash Hotfix

on:
  push:
    paths:
      - '.pack-crash-v1.1.124-trigger'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply iPhone pack crash hotfix
        run: python3 .pack-crash-v1.1.124/apply.py
      - name: Bump release
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('build.json')
          data=json.loads(p.read_text())
          data['version']='1.1.124'
          data['releasedAt']='2026-09-02'
          data['name']='v1.1.124 — iPhone Pack Reveal Stability'
          data['physicalIphoneSmoke']='pending-v1.1.124'
          p.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')
          PY
          npm run stamp-cache
          npm run generate-studio
      - name: Verify release
        run: |
          npm run test:current
          npm run flow
          npm run validate
          npm run card-ids
          python3 - <<'PY'
          from pathlib import Path
          s=Path('js/ui/app.js').read_text()
          assert 'allowAnimation = true' in s
          assert 'const animatedSurface = allowAnimation ? animatedCardSurfaceMarkup(card) : "";' in s
          assert 'allowAnimation:false' in s
          assert 'packStage = "opening";' not in s[s.index('function ripOpenPack()'):s.index('function preparePackSummary()')]
          assert 'v1.1.124 — iPhone pack reveal stability' in Path('css/game.css').read_text()
          print('Pack stability verification passed')
          PY
      - name: Publish
        run: |
          rm -rf .pack-crash-v1.1.124
          rm -f .pack-crash-v1.1.124-trigger
          rm -rf .starter-roster-v1.1.124
          rm -f .starter-roster-v1.1.124-trigger
          rm -f .github/workflows/wwe-starter-roster-v1.1.124.yml
          rm -f .github/workflows/wwe-pack-crash-v1.1.124.yml
          git config user.name 'Swoop081'
          git config user.email 'justinbelot8@gmail.com'
          git add -A
          git commit -m 'WWE Legacy v1.1.124 — iPhone pack reveal stability'
          git push origin main
