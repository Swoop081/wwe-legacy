name: WWE Legacy v1.1.132 Actual Merch Card Reveal

on:
  push:
    paths:
      - '.release-v1.1.132.trigger'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Make fifth-slot Merch reveal the actual card
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('js/ui/app.js')
          s = app.read_text()
          old = 'const converted=convertedPackCards.has(boosterFocusIndex) || p.universePointsCredited;'
          new = 'const converted=Boolean(p.universePointsValue) && (convertedPackCards.has(boosterFocusIndex) || p.universePointsCredited);'
          if old not in s:
              raise SystemExit('Expected pack conversion condition not found')
          s = s.replace(old, new, 1)
          app.write_text(s)

          hotfix = Path('js/shared/v1.1.104-pack-reward-hotfix.js')
          hotfix.write_text('''/* WWE Legacy pack presentation compatibility hotfix.\n   Daily Spin remains retired. Pack reveals are now handled entirely by the\n   core renderer so Merch pulls display their actual collectible card. */\n(() => {\n  const retireDailySpin = root => {\n    root.querySelectorAll?.('.daily-spin-ready-card,.daily-spin-home,.daily-spin-modal').forEach(node => node.remove());\n  };\n\n  const apply = () => retireDailySpin(document);\n  apply();\n  const observer = new MutationObserver(apply);\n  observer.observe(document.documentElement, { childList: true, subtree: true });\n})();\n''')
          PY

      - name: Stamp v1.1.132
        run: |
          npm version 1.1.132 --no-git-tag-version
          node - <<'NODE'
          const fs=require('fs');
          const p='build.json';
          const d=JSON.parse(fs.readFileSync(p,'utf8'));
          d.version='1.1.132';
          d.releasedAt='2026-09-03';
          d.name='v1.1.132 — Actual Merch Card Pack Reveal';
          d.physicalIphoneSmoke='browser-certified-v1.1.132';
          fs.writeFileSync(p,JSON.stringify(d,null,2)+'\n');
          NODE
          npm run stamp-cache
          npm run generate-studio

      - name: Verify core Merch reveal correction
        run: |
          node --check js/ui/app.js
          node --check js/shared/v1.1.104-pack-reward-hotfix.js
          npm run test:current
          npm run flow
          npm run validate
          npm run card-ids
          python3 - <<'PY'
          from pathlib import Path
          import json
          app=Path('js/ui/app.js').read_text()
          hotfix=Path('js/shared/v1.1.104-pack-reward-hotfix.js').read_text()
          required='const converted=Boolean(p.universePointsValue) && (convertedPackCards.has(boosterFocusIndex) || p.universePointsCredited);'
          if required not in app:
              raise SystemExit('Core reveal does not gate UP conversion on a positive UP value')
          if 'zero-up-merch-repair' in hotfix or 'SEE PACK SUMMARY FOR ITEM' in hotfix or 'MERCH PULL' in hotfix:
              raise SystemExit('Legacy Merch placeholder reveal is still active')
          if 'collectibleCardMarkup(p.card' not in app:
              raise SystemExit('Actual card renderer missing from pack reveal')
          b=json.loads(Path('build.json').read_text())
          assert b['version']=='1.1.132'
          assert json.loads(Path('package.json').read_text())['version']=='1.1.132'
          assert '?v=1.1.132' in Path('index.html').read_text()
          print('Verified: zero-UP Merch is not treated as a conversion and renders through collectibleCardMarkup.')
          PY

      - name: Install browser certification runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit

      - name: Run iPhone-size Chromium and WebKit pack certification
        run: |
          cp .release-v1.1.131-pack-browser-smoke.mjs /tmp/pack-smoke.mjs
          sed -i 's/build=1.1.131/build=1.1.132/g' /tmp/pack-smoke.mjs
          cp /tmp/pack-smoke.mjs .release-v1.1.132-pack-browser-smoke.mjs
          cd "$(dirname "$GITHUB_WORKSPACE")"
          python3 -m http.server 4173 >/tmp/wwe-pack-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          cd "$GITHUB_WORKSPACE"
          sleep 2
          node .release-v1.1.132-pack-browser-smoke.mjs

      - name: Publish verified release
        run: |
          rm -rf node_modules
          rm -f .release-v1.1.132-pack-browser-smoke.mjs .release-v1.1.132.trigger .github/workflows/wwe-pack-merch-card-v1.1.132.yml
          git add -A
          git commit -m "WWE Legacy v1.1.132 — show actual Merch card in pack reveal"
          git push origin main
