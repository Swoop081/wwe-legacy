name: WWE Legacy Pack Recovery + Starter Summary
on:
  push:
    paths:
      - '.pack-starter-fix/READY'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply pack recovery and onboarding summary
        run: python3 -c "exec(__import__('base64').b64decode('').decode())"
      - name: Bump release
        run: |
          npm version 1.1.117 --no-git-tag-version
          npm run stamp-cache
          npm run generate-studio
      - name: Verify release
        run: |
          npm run test:current
          npm run flow
          npm run validate
          npm run card-ids
          node --input-type=module -e "import fs from 'node:fs'; const s=fs.readFileSync('js/ui/app.js','utf8'); for (const m of ['function renderStarterSummary(','screen = \"starter-summary\"','function renderBoostersUnsafe() {','WWE Legacy pack render recovery']) if(!s.includes(m)) throw new Error('missing '+m); console.log('v1.1.117 markers verified');"
      - name: Publish
        run: |
          rm -rf .pack-starter-fix
          rm -f .github/workflows/wwe-pack-recovery-starter-summary.yml
          git config user.name 'Swoop081'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'WWE Legacy v1.1.117 — pack recovery and starting roster summary'
          git push origin main