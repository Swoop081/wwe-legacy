name: WWE Legacy Pack Recovery + Starter Summary
on:
  push:
    paths:
      - '.pack-starter-fix/READY'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply pack recovery and onboarding summary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/ui/app.js')
          s=p.read_text()

          # 1) After the third onboarding choice, show the roster summary instead of jumping to menu.
          old='''  starterOnboardingStep = 0;
  starterOnboardingSelections = { raw: null, smackdown: null, nxt: null };
  screen = "menu";
  message = "Your RAW, SmackDown and NXT starters are ready.";
  renderMainMenu();
}'''
          new='''  starterOnboardingStep = 0;
  starterOnboardingSelections = { raw: ids[0] ?? null, smackdown: ids[1] ?? null, nxt: ids[2] ?? null };
  screen = "starter-summary";
  message = "";
  renderStarterSummary(ids);
}'''
          if old not in s:
              raise SystemExit('chooseStarter completion block not found')
          s=s.replace(old,new,1)

          # Insert compact one-screen summary immediately before renderStarter.
          marker='''function renderStarter() {'''
          summary='''function renderStarterSummary(starterIds = profile?.starterIds ?? []) {
  setChrome({ hideTopbar: true });
  const root = $("#game");
  const ids = [...new Set((starterIds ?? []).filter(Boolean))].slice(0, 3);
  const cards = ids.map(id => superstarPreviewCardMarkup(id, "starter-summary-superstar-card")).join("");
  root.innerHTML = `<section class="starter-roster-summary" aria-label="Your Starting Roster">
    <h1>YOUR STARTING ROSTER</h1>
    <div class="starter-roster-summary-cards">${cards}</div>
    <button id="starter-summary-continue" type="button" class="start-match">CONTINUE</button>
  </section>`;
  $("#starter-summary-continue")?.addEventListener("click", () => {
    screen = "menu";
    message = "";
    renderMainMenu();
  });
}

function renderStarter() {'''
          if marker not in s:
              raise SystemExit('renderStarter marker not found')
          s=s.replace(marker,summary,1)

          # 2) Avoid re-rendering the fragile intermediate opening stage. Animate the existing pack,
          # then move directly to a fully populated reveal state.
          old_rip='''function ripOpenPack() {
  if (packStage !== "sealed" || !lastPack?.length) return;
  packStage = "opening";
  message = "RIPPING PACK…";
  renderBoosters();
  setTimeout(() => {
    if (screen !== "boosters" || packStage !== "opening") return;
    // Once the wrapper is open, the whole pack is face up. Browsing cards never
    // returns the next pull to a generic card back.
    revealedPackCards = new Set(lastPack.map((_, index) => index));
    packStage = "reveal";
    message = "Pack open — all five cards are face up.";
    renderBoosters();
    scheduleFocusedDuplicateConversion();
    maybeCelebrateFocusedSuperstarPull(300);
  }, 720);
}'''
          new_rip='''function ripOpenPack() {
  if (packStage !== "sealed" || !lastPack?.length) return;
  packStage = "opening";
  message = "RIPPING PACK…";
  document.querySelector(".sealed-pack-stage")?.classList.add("is-ripping");
  setTimeout(() => {
    if (screen !== "boosters" || packStage !== "opening") return;
    revealedPackCards = new Set(lastPack.map((_, index) => index));
    boosterFocusIndex = Math.max(0, Math.min(boosterFocusIndex, lastPack.length - 1));
    packStage = "reveal";
    message = "Pack open — all five cards are face up.";
    renderBoosters();
    scheduleFocusedDuplicateConversion();
    maybeCelebrateFocusedSuperstarPull(300);
  }, 420);
}'''
          if old_rip not in s:
              raise SystemExit('ripOpenPack block not found')
          s=s.replace(old_rip,new_rip,1)

          # 3) Wrap the booster renderer so a bad reveal frame can never leave the modal blank.
          if 'function renderBoostersUnsafe() {' not in s:
              s=s.replace('function renderBoosters() {','function renderBoostersUnsafe() {',1)
          marker2='''function formatCountdown(ms) {'''
          wrapper='''function renderBoosters() {
  try {
    renderBoostersUnsafe();
  } catch (error) {
    console.error("WWE Legacy pack render recovery", error);
    const validPulls = (lastPack ?? []).filter(p => p?.card);
    if (validPulls.length) {
      lastPack = validPulls;
      boosterFocusIndex = Math.max(0, Math.min(boosterFocusIndex, lastPack.length - 1));
      revealedPackCards = new Set(lastPack.map((_, index) => index));
      packStage = "reveal";
      message = "Pack recovered — tap the card to continue.";
      try { renderBoostersUnsafe(); return; } catch (recoveryError) { console.error("Pack recovery render failed", recoveryError); }
    }
    const root = $("#game");
    document.body.classList.remove("booster-modal-open");
    const mobileNav = document.querySelector("#mobile-game-nav");
    if (mobileNav) mobileNav.hidden = false;
    packStage = "idle";
    lastPack = null;
    message = "Pack display recovered. Your saved collection is unchanged.";
    if (root) root.innerHTML = `<section class="collection-screen booster-screen premium-screen"><div class="pack-render-recovery"><strong>PACK RECOVERED</strong><button id="pack-recovery-return" class="start-match">RETURN TO PACKS</button></div></section>`;
    $("#pack-recovery-return")?.addEventListener("click", () => { message = ""; renderBoosters(); });
  }
}

function formatCountdown(ms) {'''
          if marker2 not in s:
              raise SystemExit('formatCountdown marker not found')
          s=s.replace(marker2,wrapper,1)
          p.write_text(s)

          css=Path('css/game.css')
          c=css.read_text()
          c += '''\n/* v1.1.117 — onboarding roster summary + resilient pack rip */
.starter-roster-summary{width:min(100%,430px);min-height:100svh;margin:0 auto;padding:max(22px,env(safe-area-inset-top)) 12px max(18px,env(safe-area-inset-bottom));display:grid;grid-template-rows:auto 1fr auto;gap:14px;align-items:center;overflow:hidden}
.starter-roster-summary h1{margin:0;text-align:center;font-size:clamp(24px,7.3vw,34px);line-height:.95;letter-spacing:.04em}
.starter-roster-summary-cards{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:center;justify-items:center}
.starter-roster-summary-cards .starter-summary-superstar-card{width:100%;max-width:128px;height:auto;aspect-ratio:680/1000}
.starter-roster-summary .start-match{width:100%;min-width:0;margin:0;padding:13px 18px}
.sealed-pack-stage.is-ripping .sealed-pack-button{animation:starterPackRip .42s ease-in forwards}
@keyframes starterPackRip{0%{transform:scale(1) rotate(0)}55%{transform:scale(1.035) rotate(-1.5deg)}100%{transform:scale(.96) rotate(1deg);opacity:.15}}
.pack-render-recovery{min-height:70svh;display:grid;place-items:center;align-content:center;gap:18px;text-align:center}.pack-render-recovery strong{font-size:28px;letter-spacing:.08em}
@media(max-width:430px){.starter-roster-summary{padding-left:8px;padding-right:8px;gap:10px}.starter-roster-summary-cards{gap:5px}.starter-roster-summary h1{font-size:27px}}
'''
          css.write_text(c)
          PY
      - name: Bump release
        run: |
          npm version 1.1.117 --no-git-tag-version
          npm run stamp-cache
          npm run generate-studio
      - name: Verify release
        run: |
          npm run test:current
          npm run flow
          npm run validate
          npm run card-ids
          python3 - <<'PY'
          from pathlib import Path
          s=Path('js/ui/app.js').read_text()
          checks=['function renderStarterSummary(', 'screen = "starter-summary"', 'function renderBoostersUnsafe() {', 'WWE Legacy pack render recovery', 'sealed-pack-stage")?.classList.add("is-ripping")']
          missing=[x for x in checks if x not in s]
          if missing: raise SystemExit('missing v1.1.117 markers: '+repr(missing))
          print('v1.1.117 markers verified')
          PY
      - name: Publish
        run: |
          rm -rf .pack-starter-fix
          rm -f .github/workflows/wwe-pack-recovery-starter-summary.yml
          git config user.name 'Swoop081'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'WWE Legacy v1.1.117 — pack recovery and starting roster summary'
          git push origin main