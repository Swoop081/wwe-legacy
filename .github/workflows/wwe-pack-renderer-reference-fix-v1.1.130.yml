name: WWE Legacy v1.1.130 Pack Renderer ReferenceError Fix

on:
  push:
    paths:
      - '.release-v1.1.130.trigger'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply pack renderer fix
        run: python3 .release-v1.1.130.py
      - name: Stamp release cache/version
        run: npm run stamp-cache
      - name: Regenerate studio data
        run: npm run generate-studio
      - name: Verify exact pack crash fix
        run: |
          node --check js/ui/app.js
          npm run test:current
          npm run flow
          npm run validate
          npm run card-ids
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          s=Path('js/ui/app.js').read_text()
          start=s.index('function renderSafePackFlow()')
          end=s.index('\nfunction finishSafePackFlow()', start)
          block=s[start:end]
          assert 'const escapeHtml = value =>' in block
          assert block.index('const escapeHtml = value =>') < block.index('${escapeHtml(')
          assert 'function processPack' in s
          b=json.loads(Path('build.json').read_text())
          assert b['version']=='1.1.130'
          assert json.loads(Path('package.json').read_text())['version']=='1.1.130'
          assert '?v=1.1.130' in Path('index.html').read_text()
          assert 'config/build.js?v=1.1.130' in s
          print('v1.1.130 exact pack renderer ReferenceError fix verified')
          PY
          node - <<'NODE'
          const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]);
          const got = escapeHtml(`Bret & Owen < "Hart" > 'Test'`);
          const expected = 'Bret &amp; Owen &lt; &quot;Hart&quot; &gt; &#39;Test&#39;';
          if (got !== expected) throw new Error(`escapeHtml failed: ${got}`);
          console.log('pack text escaping runtime test passed');
          NODE
      - name: Publish
        run: |
          rm -f .release-v1.1.130.py .release-v1.1.130.trigger .github/workflows/wwe-pack-renderer-reference-fix-v1.1.130.yml
          git config user.name "Swoop081"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "WWE Legacy v1.1.130 — fix pack renderer ReferenceError"
          git push
