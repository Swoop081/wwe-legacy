name: WWE Legacy v1.1.131 Restore Original Pack Experience

on:
  push:
    paths:
      - '.release-v1.1.131.trigger'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore pre-regression pack implementation
        run: |
          git config user.name "WWE Legacy Release Bot"
          git config user.email "actions@users.noreply.github.com"
          for sha in \
            ac8c945be15869005a86389aa40eda66b383c4b2 \
            15a535c58bcadefbc199097b9a4c8ee793ab6108 \
            16e36ae655f48deaaaa81226d374ad085e57619a \
            7705a9623b8a43a27c0669994c7feedf2a5e4d73 \
            ea2e5bb722089e28a5897d37f2675a98e824e5f8 \
            016b5d2beb4cd625ce31e72b5537384a428ab4e6 \
            4da9ed3f7408c213f34a7b4f537bdd46a2f52bcd
          do
            git revert --no-commit "$sha"
          done
          rm -rf .pack-rip-fix .pack-* .release-v1.1.124* .release-v1.1.125* .release-v1.1.126* .release-v1.1.127* .release-v1.1.128* .release-v1.1.129* .release-v1.1.130*
          rm -f .github/workflows/wwe-pack-rip-state-v1.1.122.yml
          rm -f .github/workflows/wwe-pack-*v1.1.124*.yml .github/workflows/wwe-pack-*v1.1.125*.yml .github/workflows/wwe-pack-*v1.1.126*.yml .github/workflows/wwe-pack-*v1.1.127*.yml .github/workflows/wwe-pack-*v1.1.128*.yml .github/workflows/wwe-pack-*v1.1.129*.yml .github/workflows/wwe-pack-*v1.1.130*.yml

      - name: Remove the MutationObserver feedback loop that caused the freeze
        run: |
          git show 16c44cb0ce82207c1f2be8a272b475582e3f3391:js/shared/v1.1.104-pack-reward-hotfix.js > js/shared/v1.1.104-pack-reward-hotfix.js

      - name: Stamp v1.1.131
        run: |
          npm version 1.1.131 --no-git-tag-version
          node - <<'NODE'
          const fs=require('fs');
          const p='build.json';
          const d=JSON.parse(fs.readFileSync(p,'utf8'));
          d.version='1.1.131';
          d.releasedAt='2026-09-02';
          d.name='v1.1.131 — Original Pack Experience Restored + Freeze Root Cause Fixed';
          d.physicalIphoneSmoke='browser-certified-v1.1.131';
          fs.writeFileSync(p,JSON.stringify(d,null,2)+'\n');
          NODE
          npm run stamp-cache
          npm run generate-studio

      - name: Verify exact original pack experience and regression removal
        run: |
          node --check js/ui/app.js
          node --check js/shared/v1.1.104-pack-reward-hotfix.js
          npm run test:current
          npm run flow
          npm run validate
          npm run card-ids
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, json
          current=Path('js/ui/app.js').read_text()
          historical=subprocess.check_output(['git','show','d807d9905d51e03bb517a19b8392354086581df4:js/ui/app.js'],text=True)
          start='function processPack(kind = "standard")'
          end='function premiumHubHeading('
          cur_seg=current[current.index(start):current.index(end)]
          old_seg=historical[historical.index(start):historical.index(end)]
          if cur_seg != old_seg:
              import difflib
              diff=''.join(difflib.unified_diff(old_seg.splitlines(True),cur_seg.splitlines(True),fromfile='v1.1.123-original-pack',tofile='v1.1.131-restored-pack'))
              raise SystemExit('Original pack subsystem is not restored exactly:\n'+diff[:12000])
          required=['TAP TO RIP','Open the pack and reveal all five cards','RIPPING PACK…','RIP!','Pack open — all five cards are face up.','TAP CARD · NEXT CARD','TAP CARD · PACK SUMMARY','PACK COMPLETE','collectibleCardMarkup(p.card']
          for marker in required:
              if marker not in cur_seg: raise SystemExit(f'Missing original pack marker: {marker}')
          forbidden=['renderSafePackFlow','booster-safe-reveal-card','full surface pack tap','iPhone Safari stability: do not allocate']
          for marker in forbidden:
              if marker in current: raise SystemExit(f'Emergency replacement still present: {marker}')
          hotfix=Path('js/shared/v1.1.104-pack-reward-hotfix.js').read_text()
          old_hotfix=subprocess.check_output(['git','show','16c44cb0ce82207c1f2be8a272b475582e3f3391:js/shared/v1.1.104-pack-reward-hotfix.js'],text=True)
          if hotfix != old_hotfix: raise SystemExit('Pack observer was not restored to the pre-regression implementation')
          if "root.querySelectorAll?.('.single-card-reveal-hint,.reveal-progress')" in hotfix:
              raise SystemExit('Regression loop still present')
          if "simplifyPack" in hotfix:
              raise SystemExit('v1.1.105 presentation rewrite still present')
          b=json.loads(Path('build.json').read_text())
          assert b['version']=='1.1.131'
          assert json.loads(Path('package.json').read_text())['version']=='1.1.131'
          assert '?v=1.1.131' in Path('index.html').read_text()
          print('Original pack subsystem restored exactly and MutationObserver regression removed.')
          PY

      - name: Install browser certification runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit

      - name: Run iPhone-size Chromium and WebKit pack certification
        run: |
          cd "$(dirname "$GITHUB_WORKSPACE")"
          python3 -m http.server 4173 >/tmp/wwe-pack-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          cd "$GITHUB_WORKSPACE"
          sleep 2
          node .release-v1.1.131-pack-browser-smoke.mjs

      - name: Publish verified release
        run: |
          rm -rf node_modules
          git reset
          git add -u
          git restore --staged .github/workflows 2>/dev/null || true
          git restore .github/workflows 2>/dev/null || true
          git restore --staged .release-v1.1.131.trigger .release-v1.1.131-pack-browser-smoke.mjs 2>/dev/null || true
          git restore .release-v1.1.131.trigger .release-v1.1.131-pack-browser-smoke.mjs 2>/dev/null || true
          echo 'Production files staged for v1.1.131:'
          git diff --cached --name-status
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo 'Workflow mutation accidentally staged' >&2
            exit 1
          fi
          if git diff --cached --name-only | grep -q '^node_modules/'; then
            echo 'node_modules accidentally staged' >&2
            exit 1
          fi
          git commit -m "WWE Legacy v1.1.131 — restore original pack opening and fix observer freeze"
          git push origin main
