name: WWE Legacy v1.1.122 Pack Rip State Fix
on:
  push:
    paths:
      - '.pack-rip-fix/READY'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fix pack rip transition state
        run: python3 .pack-rip-fix/fix.py
      - name: Bump release
        run: |
          npm version 1.1.122 --no-git-tag-version
          node -e "const fs=require('fs');const p='build.json';const d=JSON.parse(fs.readFileSync(p,'utf8'));d.version='1.1.122';d.name='v1.1.122 — Pack Rip State Transition Fix';fs.writeFileSync(p,JSON.stringify(d,null,2)+'\n')"
          npm run stamp-cache
          npm run generate-studio
      - name: Verify release
        run: |
          npm run test:current
          npm run flow
          npm run validate
          npm run card-ids
          node -e "const s=require('fs').readFileSync('js/ui/app.js','utf8');if(!s.includes('screen = \"boosters\";\n    currentPackType = \"standard\";'))process.exit(1);if(!s.includes('if (packStage !== \"opening\" || !lastPack?.length) return;'))process.exit(1);if(s.includes('if (screen !== \"boosters\" || packStage !== \"opening\") return;'))process.exit(1);console.log('Pack rip transition state verified')"
      - name: Publish
        run: |
          rm -rf .pack-rip-fix
          rm -f .github/workflows/wwe-pack-rip-state-v1.1.122.yml
          git config user.name 'WWE Legacy Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'WWE Legacy v1.1.122 — fix pack rip transition crash'
          git push origin main