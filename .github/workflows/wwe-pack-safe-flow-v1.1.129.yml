name: WWE Legacy v1.1.129 Safe Pack Flow Recovery

on:
  push:
    paths:
      - '.release-v1.1.129.trigger'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply safe pack flow recovery
        run: python3 .release-v1.1.129.py
      - name: Stamp release cache/version
        run: npm run stamp-cache
      - name: Regenerate studio data
        run: npm run generate-studio
      - name: Verify release
        run: |
          npm run test:current
          npm run flow
          npm run validate
          npm run card-ids
          python3 - <<'PY'
          from pathlib import Path
          import json
          s=Path('js/ui/app.js').read_text()
          assert 'function renderSafePackFlow()' in s
          assert 'packStage = "safe-reveal";' in s
          assert 'renderSafePackFlow();' in s
          assert 'saveProfile(profile); renderBoosters();' not in s[s.index('function processPack'):s.index('function scheduleFocusedDuplicateConversion')]
          b=json.loads(Path('build.json').read_text())
          assert b['version']=='1.1.129'
          assert json.loads(Path('package.json').read_text())['version']=='1.1.129'
          assert '?v=1.1.129' in Path('index.html').read_text()
          assert 'config/build.js?v=1.1.129' in Path('js/ui/app.js').read_text()
          print('v1.1.129 safe pack flow verified')
          PY
      - name: Publish
        run: |
          rm -f .release-v1.1.129.py .release-v1.1.129.trigger .github/workflows/wwe-pack-safe-flow-v1.1.129.yml
          git config user.name "Swoop081"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "WWE Legacy v1.1.129 — safe pack flow recovery"
          git push
