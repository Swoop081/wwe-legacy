name: WWE Legacy v1.1.125 Pack Tap + Cache Fix
on:
  push:
    paths:
      - '.pack-click-v1.1.125/trigger.txt'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply pack tap hardening
        run: python3 .pack-click-v1.1.125/apply.py
      - name: Bump v1.1.125 and stamp cache
        run: |
          npm version 1.1.125 --no-git-tag-version
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('build.json')
          data=json.loads(p.read_text())
          data['version']='1.1.125'
          data['releasedAt']='2026-09-02'
          data['name']='v1.1.125 — iPhone Chrome Pack Tap + Cache Fix'
          p.write_text(json.dumps(data,indent=2)+"\n")
          PY
          npm run stamp-cache
      - name: Verify release
        run: |
          npm run test:current
          npm run flow
          npm run validate
          npm run card-ids
          python3 - <<'PY'
          from pathlib import Path
          app=Path('js/ui/app.js').read_text()
          css=Path('css/game.css').read_text()
          index=Path('index.html').read_text()
          assert 'ripPackButton.addEventListener("pointerup", handleRipGesture)' in app
          assert 'ripPackButton.addEventListener("touchend", handleRipGesture, { passive: false })' in app
          assert 'v1.1.125 — iPhone Chrome sealed-pack interaction hardening' in css
          assert 'app.js?v=1.1.125' in index
          assert 'game.css?v=1.1.125' in index
          assert 'app.js?v=1.1.123' not in index
          print('v1.1.125 pack tap + cache verification passed')
          PY
      - name: Publish
        run: |
          rm -rf .pack-click-v1.1.125
          rm -f .github/workflows/wwe-pack-tap-v1.1.125.yml
          git config user.name "Swoop081"
          git config user.email "justinbelot8@gmail.com"
          git add -A
          git commit -m "WWE Legacy v1.1.125 — restore iPhone Chrome pack tap"
          git push origin main
