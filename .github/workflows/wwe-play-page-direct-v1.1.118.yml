name: WWE Legacy v1.1.118 Play Page Direct Fix
on:
  push:
    paths:
      - '.play-page-direct/READY'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply Play page fix
        run: python3 tools/v1.1.118-play-page-direct-fix.py
      - name: Bump package and stamp cache
        run: |
          npm version 1.1.118 --no-git-tag-version
          npm run stamp-cache
          npm run generate-studio
      - name: Verify release
        run: |
          npm run test:current
          npm run flow
          npm run validate
          npm run card-ids
          python3 - <<'PY'
          from pathlib import Path
          s=Path('js/ui/app.js').read_text()
          start=s.index('const firstPageCards')
          live=s.index('id="play-live-event"',start)
          ex=s.index('id="play-exhibition"',start)
          kotr=s.index('id="play-kotr"',start)
          assert live < ex < kotr
          assert Path('css/v1.1.118-play-page-live-events-hero.css').exists()
          assert 'v1.1.118-play-page-live-events-hero.css' in Path('index.html').read_text()
          print('Play page hero verified')
          PY
      - name: Publish
        run: |
          rm -rf .play-page-direct .release
          rm -f .github/workflows/wwe-play-page-direct-v1.1.118.yml
          rm -f .github/workflows/wwe-play-page-live-events-hero.yml
          rm -f tools/v1.1.118-play-page-direct-fix.py
          git config user.name 'Swoop081'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'WWE Legacy v1.1.118 — Live Events Play page hero'
          git push origin main