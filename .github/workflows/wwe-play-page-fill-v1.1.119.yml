name: WWE Legacy v1.1.119 Play Page Viewport Fill
on:
  push:
    paths:
      - '.play-page-fill/READY'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply Play page viewport fill
        run: |
          cat > css/v1.1.118-play-page-live-events-hero.css <<'CSS'
          /* v1.1.119 — Play page one fills the real iPhone viewport. */
          @media (max-width:600px){
            .legacy-play-v3.play-menu-page-1{
              box-sizing:border-box!important;
              min-height:calc(100dvh - 188px)!important;
              height:calc(100dvh - 188px)!important;
              display:grid!important;
              grid-template-rows:auto minmax(0,1fr) auto!important;
              gap:9px!important;
              padding-bottom:4px!important;
              overflow:hidden!important;
            }
            .play-menu-page-1 .legacy-play-heading{padding-block:4px 2px!important;margin:0!important}
            .play-menu-page-1 .legacy-play-heading h2{font-size:clamp(29px,8.2vw,38px);line-height:.92;margin:0}
            .play-menu-page-1 .legacy-play-heading p{margin:3px 0 0;font-size:12px}
            .play-menu-page-1 .legacy-mode-stack{
              display:grid!important;
              grid-template-rows:minmax(0,1.72fr) minmax(0,.82fr) minmax(0,.82fr)!important;
              gap:8px!important;
              min-height:0!important;
              height:100%!important;
            }
            .play-menu-page-1 .legacy-mode-banner{min-height:0!important;height:100%!important;margin:0!important;border-radius:10px;overflow:hidden}
            .play-menu-page-1 #play-live-event .legacy-mode-superstar{width:52%!important;right:-1%!important;transform:scale(1.16)!important;transform-origin:bottom right!important}
            .play-menu-page-1 #play-live-event .legacy-mode-copy{width:63%!important;padding:18px 8px 15px 15px!important}
            .play-menu-page-1 #play-live-event .mode-logo span,.play-menu-page-1 #play-live-event .mode-logo strong{font-size:clamp(38px,11vw,55px)!important;line-height:.81!important}
            .play-menu-page-1 #play-live-event .legacy-mode-copy>b{font-size:14px!important;padding:11px 13px!important;margin-top:10px!important}
            .play-menu-page-1 :is(#play-exhibition,#play-kotr) .legacy-mode-superstar{width:36%!important;right:0!important}
            .play-menu-page-1 :is(#play-exhibition,#play-kotr) .legacy-mode-copy{width:71%!important;padding:9px 7px 8px 12px!important}
            .play-menu-page-1 :is(#play-exhibition,#play-kotr) .mode-logo span,.play-menu-page-1 :is(#play-exhibition,#play-kotr) .mode-logo strong{font-size:clamp(25px,7.2vw,34px)!important;line-height:.84!important}
            .play-menu-page-1 :is(#play-exhibition,#play-kotr) .legacy-mode-copy em{font-size:9px!important}
            .play-menu-page-1 :is(#play-exhibition,#play-kotr) .legacy-mode-copy small{font-size:9px!important;line-height:1.05!important;margin-top:1px!important}
            .play-menu-page-1 :is(#play-exhibition,#play-kotr) .legacy-mode-copy>b{font-size:11px!important;padding:7px 9px!important;margin-top:5px!important}
            .play-menu-page-1 .play-mode-page-arrow{min-height:58px!important;height:58px!important;margin:0!important;padding:0 18px!important;border-radius:9px!important}
            .play-menu-page-1 .play-mode-page-arrow span{font-size:12px}
            .play-menu-page-1 .play-mode-page-arrow b{font-size:36px}
          }
          CSS
      - name: Bump release
        run: |
          npm version 1.1.119 --no-git-tag-version
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('build.json')
          d=json.loads(p.read_text())
          d['version']='1.1.119'
          d['releasedAt']='2026-09-02'
          d['name']='v1.1.119 — Play Page Full Viewport Fill'
          p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          npm run stamp-cache
          npm run generate-studio
      - name: Verify release
        run: |
          npm run test:current
          npm run flow
          npm run validate
          npm run card-ids
          grep -q '100dvh - 188px' css/v1.1.118-play-page-live-events-hero.css
          grep -q '1.72fr' css/v1.1.118-play-page-live-events-hero.css
      - name: Publish
        run: |
          rm -rf .play-page-fill
          rm -f .github/workflows/wwe-play-page-fill-v1.1.119.yml
          rm -rf .release || true
          rm -f .github/workflows/wwe-play-page-live-events-hero.yml || true
          git config user.name 'Swoop081'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'WWE Legacy v1.1.119 — Play page fills iPhone viewport'
          git push origin main