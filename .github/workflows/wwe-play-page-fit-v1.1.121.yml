name: WWE Legacy v1.1.121 Play Page Fit
on:
  push:
    paths:
      - '.play-page-fit/READY'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tighten Play page cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('css/v1.1.118-play-page-live-events-hero.css')
          s=p.read_text()
          s=s.replace('/* v1.1.120 — balanced Play page one, larger portraits, all controls above bottom nav. */','/* v1.1.121 — slightly tighter Play page cards so Next Page is fully visible on iPhone. */')
          s=s.replace('min-height:calc(100dvh - 220px)!important;','min-height:calc(100dvh - 246px)!important;')
          s=s.replace('height:calc(100dvh - 220px)!important;','height:calc(100dvh - 246px)!important;')
          s=s.replace('gap:8px!important;','gap:6px!important;',1)
          s=s.replace('grid-template-rows:minmax(0,1.28fr) minmax(0,1fr) minmax(0,1fr)!important;','grid-template-rows:minmax(0,1.24fr) minmax(0,.96fr) minmax(0,.96fr)!important;')
          s=s.replace('gap:8px!important;\n    min-height:0!important;','gap:6px!important;\n    min-height:0!important;')
          s=s.replace('min-height:56px!important;height:56px!important;','min-height:52px!important;height:52px!important;')
          p.write_text(s)
          PY
      - name: Bump release
        run: |
          npm version 1.1.121 --no-git-tag-version
          npm run stamp-cache
          npm run generate-studio
      - name: Verify release
        run: |
          npm run test:current
          npm run flow
          npm run validate
          npm run card-ids
          grep -q '100dvh - 246px' css/v1.1.118-play-page-live-events-hero.css
          grep -q 'height:52px' css/v1.1.118-play-page-live-events-hero.css
      - name: Publish
        run: |
          rm -rf .play-page-fit
          rm -f .github/workflows/wwe-play-page-fit-v1.1.121.yml
          git config user.name 'WWE Legacy Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'WWE Legacy v1.1.121 — Play page cards fit above nav'
          git push origin main