name: WWE Legacy v1.1.120 Play Page Proportions
on:
  push:
    paths:
      - '.play-page-v1.1.120/READY'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply Play page proportions and portrait sizing
        run: |
          cat > css/v1.1.118-play-page-live-events-hero.css <<'CSS'
          /* v1.1.120 — balanced Play page one, larger portraits, all controls above bottom nav. */
          @media (max-width:600px){
            .legacy-play-v3.play-menu-page-1{
              box-sizing:border-box!important;
              min-height:calc(100dvh - 220px)!important;
              height:calc(100dvh - 220px)!important;
              display:grid!important;
              grid-template-rows:auto minmax(0,1fr) auto!important;
              gap:8px!important;
              padding-bottom:4px!important;
              overflow:hidden!important;
            }
            .play-menu-page-1 .legacy-play-heading{padding-block:3px 1px!important;margin:0!important}
            .play-menu-page-1 .legacy-play-heading h2{font-size:clamp(29px,8.2vw,38px)!important;line-height:.92!important;margin:0!important}
            .play-menu-page-1 .legacy-play-heading p{margin:3px 0 0!important;font-size:12px!important}
            .play-menu-page-1 .legacy-mode-stack{
              display:grid!important;
              grid-template-rows:minmax(0,1.28fr) minmax(0,1fr) minmax(0,1fr)!important;
              gap:8px!important;
              min-height:0!important;
              height:100%!important;
            }
            .play-menu-page-1 .legacy-mode-banner{min-height:0!important;height:100%!important;margin:0!important;border-radius:10px!important;overflow:hidden!important}
            .play-menu-page-1 #play-live-event .legacy-mode-superstar{width:54%!important;right:-2%!important;transform:none!important}
            .play-menu-page-1 #play-exhibition .legacy-mode-superstar{width:49%!important;right:-2%!important;transform:none!important}
            .play-menu-page-1 #play-kotr .legacy-mode-superstar{width:48%!important;right:-2%!important;transform:none!important}
            .play-menu-page-1 #play-live-event .legacy-mode-superstar img.official-menu-superstar-photo{transform:translate(7%,10%) scale(1.62)!important;transform-origin:bottom center!important}
            .play-menu-page-1 #play-exhibition .legacy-mode-superstar img.official-menu-superstar-photo{transform:translate(9%,11%) scale(1.72)!important;transform-origin:bottom center!important}
            .play-menu-page-1 #play-kotr .legacy-mode-superstar img.official-menu-superstar-photo{transform:translate(8%,10%) scale(1.62)!important;transform-origin:bottom center!important}
            .play-menu-page-1 #play-live-event .legacy-mode-copy{width:62%!important;padding:13px 8px 11px 14px!important}
            .play-menu-page-1 #play-live-event .mode-logo span,.play-menu-page-1 #play-live-event .mode-logo strong{font-size:clamp(34px,9.8vw,49px)!important;line-height:.82!important}
            .play-menu-page-1 #play-live-event .legacy-mode-copy>b{font-size:13px!important;padding:9px 11px!important;margin-top:7px!important}
            .play-menu-page-1 :is(#play-exhibition,#play-kotr) .legacy-mode-copy{width:68%!important;padding:9px 7px 8px 12px!important}
            .play-menu-page-1 :is(#play-exhibition,#play-kotr) .mode-logo span,.play-menu-page-1 :is(#play-exhibition,#play-kotr) .mode-logo strong{font-size:clamp(26px,7.5vw,35px)!important;line-height:.84!important}
            .play-menu-page-1 :is(#play-exhibition,#play-kotr) .legacy-mode-copy em{font-size:9px!important}
            .play-menu-page-1 :is(#play-exhibition,#play-kotr) .legacy-mode-copy small{font-size:9px!important;line-height:1.05!important;margin-top:1px!important}
            .play-menu-page-1 :is(#play-exhibition,#play-kotr) .legacy-mode-copy>b{font-size:11px!important;padding:7px 9px!important;margin-top:5px!important}
            .play-menu-page-1 .play-mode-page-arrow{min-height:56px!important;height:56px!important;margin:0!important;padding:0 18px!important;border-radius:9px!important}
            .play-menu-page-1 .play-mode-page-arrow span{font-size:12px!important}
            .play-menu-page-1 .play-mode-page-arrow b{font-size:35px!important}
          }
          CSS
      - name: Bump release
        run: |
          npm version 1.1.120 --no-git-tag-version
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('build.json','utf8'));
          p.version='1.1.120';
          p.name='v1.1.120 — Play Page Proportions + Larger Portraits';
          fs.writeFileSync('build.json',JSON.stringify(p,null,2)+'\n');
          NODE
          npm run stamp-cache
          npm run generate-studio
      - name: Verify release
        run: |
          npm run test:current
          npm run flow
          npm run validate
          npm run card-ids
          grep -q 'scale(1.72)' css/v1.1.118-play-page-live-events-hero.css
          grep -q '100dvh - 220px' css/v1.1.118-play-page-live-events-hero.css
      - name: Publish
        run: |
          rm -rf .play-page-v1.1.120
          rm -f .github/workflows/wwe-play-page-v1.1.120.yml
          git config user.name 'Swoop081'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'WWE Legacy v1.1.120 — Play page proportions and larger portraits'
          git push origin main