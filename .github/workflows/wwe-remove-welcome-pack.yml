name: WWE Legacy Remove Welcome Pack

on:
  push:
    paths:
      - '.welcome-hotfix/READY'

permissions:
  contents: write

jobs:
  remove-welcome-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove obsolete welcome Superstar pack
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          app_path = Path('js/ui/app.js')
          text = app_path.read_text()

          old_import = 'import { STARTER_CHOICES, WELCOME_SUPERSTAR_SET_IDS, createProfile, claimWelcomeSuperstar, claimWelcomeSuperstarPack, welcomeSuperstarState, hasSuperstar, loadProfile, saveProfile, resetProfile, profilePersistenceStatus, setDeckAssistance, ownedCount } from "../data/profile.js?v=1.1.99";'
          new_import = 'import { STARTER_CHOICES, createProfile, hasSuperstar, loadProfile, saveProfile, resetProfile, profilePersistenceStatus, setDeckAssistance, ownedCount } from "../data/profile.js?v=1.1.99";'
          if text.count(old_import) != 1:
              raise SystemExit(f'Expected exactly one old profile import, found {text.count(old_import)}')
          text = text.replace(old_import, new_import, 1)

          old_launch_gate = '  // Finish first-time profile setup before granting recurring launch rewards.\n  if (!welcomeSuperstarState(profile).claimed) { showMainMenu(); return; }\n'
          if text.count(old_launch_gate) != 1:
              raise SystemExit(f'Expected exactly one launch welcome gate, found {text.count(old_launch_gate)}')
          text = text.replace(old_launch_gate, '', 1)

          old_menu_gate = '  if (!welcomeSuperstarState(profile).claimed) { screen = "welcome-superstar"; message = ""; renderWelcomeSuperstar(); return; }\n'
          if text.count(old_menu_gate) != 1:
              raise SystemExit(f'Expected exactly one main-menu welcome gate, found {text.count(old_menu_gate)}')
          text = text.replace(old_menu_gate, '', 1)

          pattern = r'\nfunction renderWelcomeSuperstar\(\) \{.*?\n\}\n\nfunction renderStarter\(\) \{'
          text, count = re.subn(pattern, '\nfunction renderStarter() {', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected exactly one welcome renderer block, removed {count}')

          old_dispatch = 'else if (screen === "welcome-superstar") renderWelcomeSuperstar(); '
          if text.count(old_dispatch) != 1:
              raise SystemExit(f'Expected exactly one welcome dispatch route, found {text.count(old_dispatch)}')
          text = text.replace(old_dispatch, '', 1)

          forbidden = ['welcome-superstar', 'renderWelcomeSuperstar', 'claimWelcomeSuperstarPack', 'welcomeSuperstarState', 'ONE-TIME WELCOME REWARD', 'Open Your Superstar Pack']
          remaining = [token for token in forbidden if token in text]
          if remaining:
              raise SystemExit('Obsolete welcome-pack UI tokens remain in app.js: ' + ', '.join(remaining))

          app_path.write_text(text)

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          if package.get('version') != '1.1.99':
              raise SystemExit(f'Expected package version 1.1.99, found {package.get("version")}')
          package['version'] = '1.1.100'
          package_path.write_text(json.dumps(package, indent=2) + '\n')
          PY

      - name: Stamp release version and regenerate Card Studio data
        shell: bash
        run: |
          set -euo pipefail
          npm run stamp-cache
          npm run generate-studio

      - name: Verify release
        shell: bash
        run: |
          set -euo pipefail
          npm run test:current
          npm run flow
          npm run validate
          npm run card-ids

      - name: Publish verified v1.1.100
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .welcome-hotfix
          rm -f .github/workflows/wwe-remove-welcome-pack.yml
          git config user.name "WWE Legacy Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes to publish."; exit 1; }
          git commit -m "WWE Legacy v1.1.100 — remove obsolete welcome Superstar pack"
          git push origin HEAD:main
