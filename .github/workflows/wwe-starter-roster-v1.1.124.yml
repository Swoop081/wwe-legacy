name: WWE Legacy v1.1.124 Starter Roster 1+2 Layout
on:
  push:
    paths:
      - '.starter-roster-v1.1.124/READY'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply starter roster 1+2 layout
        run: python3 .starter-roster-v1.1.124/apply.py
      - name: Bump release
        run: |
          npm version 1.1.124 --no-git-tag-version
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('build.json')
          d=json.loads(p.read_text())
          d['version']='1.1.124'
          d['name']='v1.1.124 — Starter Roster 1+2 Layout'
          p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          npm run stamp-cache
          npm run generate-studio
      - name: Verify release
        run: |
          npm run test:current
          npm run flow
          npm run validate
          npm run card-ids
          python3 - <<'PY'
          from pathlib import Path
          s=Path('js/ui/app.js').read_text()
          c=Path('css/game.css').read_text()
          assert 'starter-roster-brand' in s
          assert 'branding-wwe-legacy-reward-logo.png' in s
          assert '<span>HERE’S YOUR</span><span>STARTING ROSTER</span>' in s
          assert 'starter-roster-lead' in s
          assert 'starter-roster-pair' in s
          assert 'height:100dvh' in c
          assert 'body[data-screen="starter"]{overflow:hidden' in c
          assert 'grid-template-columns:repeat(3,minmax(0,1fr))' not in c[c.index('/* v1.1.124 — starter roster 1+2 layout'):]
          print('Starter roster 1+2 one-screen layout verified')
          PY
      - name: Publish
        run: |
          rm -rf .starter-roster-v1.1.124
          rm -f .github/workflows/wwe-starter-roster-v1.1.124.yml
          git config user.name 'WWE Legacy Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'WWE Legacy v1.1.124 — starter roster 1+2 layout'
          git push origin main
